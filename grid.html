<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Norham parcel grid</title>
<style>
  body { margin: 0; background: #100e0c; color: #f4ead8; font: 17px/1.4 Georgia, serif; padding: 22px 16px 48px; }
  a { color: #e2c27a; }
  h1 { font-weight: normal; letter-spacing: .14em; font-size: 28px; margin: 8px 0; }
  .muted { color: #cbb892; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0; }
  button { font: inherit; color: inherit; text-align: left; border-radius: 12px; padding: 10px; min-height: 92px; border: 1px solid #4a3d28; background: #1a1612; }
  .named { border-color: #e2c27a; background: #241c12; }
  .town { background: #1c2218; border-color: #3d4a34; }
  .later { opacity: .55; }
  .ord { display: block; color: #e2c27a; font-size: 12px; letter-spacing: .08em; }
  #sheet { margin-top: 8px; border-top: 1px solid #4a3d28; padding-top: 12px; }
</style>
</head>
<body>
<p><a href="index.html">Norham</a> · <a href="rules.html">Rules</a></p>
<h1>PARCELS</h1>
<p class="muted">The parcel is the unit. Cut from the center, one at a time. No coin mint. Town places are not parcels.</p>
<div class="grid" id="grid"></div>
<div id="sheet" class="muted">Tap a square.</div>
<script>
const cells = [
  ["Chapel","town","Town. Not for sale.",""],
  ["Well","town","Water. Not a key.",""],
  ["Market","town","Stalls. Not a parcel.",""],
  ["Gate","town","The city keeps the gate.",""],
  ["Inn","town","Public hearth. Not a key.",""],
  ["","later","Blank. Not cut.",""],
  ["Quill","named","Shop. Counter. Fourth from the center.","4"],
  ["Hearth","named","House. Two rooms. First parcel. The center.","1"],
  ["Loaf","named","Shop. Floor and a back room. Second.","2"],
  ["","later","Blank. Not cut.",""],
  ["School","town","Not for sale.",""],
  ["The Cup","named","Inn. Four beds. Third.","3"],
  ["Green","town","The green. Not a key.",""],
  ["Forge","named","Workshop. Work floor. Fifth.","5"],
  ["","later","Blank. Not cut.",""],
  ["","later","Blank. Not cut.",""],
  ["","later","Drawn, not cut.",""],
  ["","later","Drawn, not cut.",""],
  ["","later","Drawn, not cut.",""],
  ["","later","Blank. Not cut.",""]
];
const grid = document.getElementById("grid");
const sheet = document.getElementById("sheet");
cells.forEach(c => {
  const b = document.createElement("button");
  b.className = c[1];
  const label = c[0] || "·";
  b.innerHTML = (c[3] ? "<span class='ord'>" + c[3] + "</span>" : "") + "<b>" + label + "</b>";
  b.onclick = () => {
    const sale = c[1] === "town" ? "Stays unsold." : c[1] === "named" ? "Named. Not minted. No coin." : "Not cut yet.";
    sheet.textContent = (c[0] || "Empty parcel") + " — " + c[2] + " " + sale;
  };
  grid.appendChild(b);
});
</script>
</body>
</html>
