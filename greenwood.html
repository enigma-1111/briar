<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Greenwood — Norham</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c140e; overflow: hidden; touch-action: none; color: #f4ead8; font: 16px Georgia, serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 14px; top: 12px; text-shadow: 0 2px 6px #000; pointer-events: none; }
  #card { position: fixed; left: 12px; right: 12px; bottom: 124px; display: none; background: #14120ee8; border: 1px solid #e2c27a; border-radius: 14px; padding: 12px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 10px 14px; margin-right: 8px; background: #e2c27a; color: #1a140c; }
  #stick { position: fixed; left: 16px; bottom: 16px; width: 104px; height: 104px; border-radius: 50%; border: 1px solid rgba(226,194,122,.6); touch-action: none; }
  #knob { width: 42px; height: 42px; border-radius: 50%; background: #e2c27a; position: absolute; left: 31px; top: 31px; }
</style>
</head>
<body>
<div id="hud">CHAPEL</div>
<div id="card"><button id="enter">Go in</button></div>
<div id="stick"><div id="knob"></div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1a12);
scene.fog = new THREE.Fog(0x0e1a12, 8, 36);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 90);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.AmbientLight(0x8aa888, 0.5));
scene.add(new THREE.HemisphereLight(0xb7d0a4, 0x1a2418, 0.35));
const outside = new THREE.Group();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x1c3a22 }));
ground.rotation.x = -Math.PI / 2;
const path = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 16), new THREE.MeshStandardMaterial({ color: 0x3a3324 }));
path.rotation.x = -Math.PI / 2;
path.position.y = 0.02;
outside.add(ground, path);
function oak(x, z) {
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.32, 2.4, 6), new THREE.MeshStandardMaterial({ color: 0x4a3424 }));
  t.position.set(x, 1.2, z);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(1.35, 8, 6), new THREE.MeshStandardMaterial({ color: 0x2f6a34 }));
  leaf.position.set(x, 2.7, z);
  outside.add(t, leaf);
}
[[-4,-5],[4.2,-3],[-5,1],[5,2],[-3.4,5],[3.6,6],[-6,-1],[6.2,-6],[0,8],[-2,-8],[2.4,-7]].forEach(([x,z]) => oak(x,z));
const chapel = new THREE.Group();
const stone = new THREE.MeshStandardMaterial({ color: 0x6a6258 });
const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.2, 3.2), stone);
body.position.y = 1.1;
const roof = new THREE.Mesh(new THREE.ConeGeometry(2.1, 1.1, 4), new THREE.MeshStandardMaterial({ color: 0x2a241c }));
roof.position.y = 2.6;
roof.rotation.y = Math.PI / 4;
const door = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.15, 0.08), new THREE.MeshStandardMaterial({ color: 0x3a2416 }));
door.position.set(0, 0.58, -1.62);
const step = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.08, 0.4), stone);
step.position.set(0, 0.04, -1.9);
const board = document.createElement("canvas");
board.width = 512; board.height = 160;
const g = board.getContext("2d");
g.fillStyle = "#1c2418"; g.fillRect(0,0,512,160);
g.strokeStyle = "#e2c27a"; g.lineWidth = 10; g.strokeRect(8,8,496,144);
g.fillStyle = "#f4ead8"; g.font = "72px Georgia"; g.textAlign = "center"; g.textBaseline = "middle";
g.fillText("CHAPEL", 256, 84);
const title = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.4), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(board) }));
title.position.set(0, 1.85, -1.66);
chapel.add(body, roof, door, step, title);
chapel.position.set(0, 0, 4.2);
outside.add(chapel);
scene.add(outside);
const inside = new THREE.Group();
inside.visible = false;
const W = 8, D = 9.6, H = 7.2;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({ color: 0x3a2e24 }));
floor.rotation.x = -Math.PI / 2;
inside.add(floor);
const aisle = new THREE.Mesh(new THREE.PlaneGeometry(1.4, D - 1), new THREE.MeshStandardMaterial({ color: 0x6a2430 }));
aisle.rotation.x = -Math.PI / 2;
aisle.position.y = 0.02;
inside.add(aisle);
const wall = new THREE.MeshStandardMaterial({ color: 0x5c564c });
[[0, H/2, -D/2, W, H, 0.2],[0, H/2, D/2, W, H, 0.2],[-W/2, H/2, 0, 0.2, H, D],[W/2, H/2, 0, 0.2, H, D]].forEach(w => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w[3], w[4], w[5]), wall);
  m.position.set(w[0], w[1], w[2]);
  inside.add(m);
});
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({ color: 0x2a241c, side: THREE.DoubleSide }));
ceil.rotation.x = Math.PI / 2;
ceil.position.y = H;
inside.add(ceil);
[-2.2, 0, 2.2].forEach(x => {
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(1.1, D - 1.2), new THREE.MeshBasicMaterial({ color: 0xcfe6ff, side: THREE.DoubleSide }));
  sky.rotation.x = Math.PI / 2;
  sky.position.set(x, H - 0.02, 0);
  inside.add(sky);
  const shaft = new THREE.SpotLight(0xfff2d0, 1.2, 12, 0.4);
  shaft.position.set(x, H - 0.2, 0);
  shaft.target.position.set(x, 0, 0);
  inside.add(shaft, shaft.target);
});
for (let z = -2.4; z <= 2.4; z += 1.2) {
  [-2.2, 2.2].forEach(x => {
    const pew = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 0.45), new THREE.MeshStandardMaterial({ color: 0x4a3424 }));
    pew.position.set(x, 0.28, z);
    inside.add(pew);
    const cloak = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.7, 6), new THREE.MeshStandardMaterial({ color: [0x8a3a2a,0x3d5340,0x1c2436,0xcbb892,0x6a2430][(x+z+8)%5] }));
    cloak.position.set(x + (x<0?0.3:-0.3), 0.7, z);
    const hood = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), cloak.material);
    hood.position.set(cloak.position.x, 1.1, z);
    inside.add(cloak, hood);
  });
}
const altar = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.9, 0.8), new THREE.MeshStandardMaterial({ color: 0xe2c27a }));
altar.position.set(0, 0.5, 3.6);
inside.add(altar);
const cloth = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.08, 0.7), new THREE.MeshStandardMaterial({ color: 0x6a2430 }));
cloth.position.set(0, 0.98, 3.6);
inside.add(cloth);
[-0.6, 0.6].forEach(x => {
  const c = new THREE.PointLight(0xffc98a, 0.8, 4);
  c.position.set(x, 1.3, 3.6);
  inside.add(c);
});
[-3, 3].forEach(x => {
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 2.2), new THREE.MeshBasicMaterial({ color: x<0?0x3a6a8a:0x8a3a4a, side: THREE.DoubleSide }));
  glass.position.set(x, 2.4, D/2 - 0.12);
  inside.add(glass);
});
scene.add(inside);
const player = { x: 0, z: -6, yaw: 0 };
let joy = { x: 0, y: 0 }, look = false, lx = 0, inChapel = false;
const stick = document.getElementById("stick"), knob = document.getElementById("knob");
stick.addEventListener("pointerdown", e => stick.setPointerCapture(e.pointerId));
stick.addEventListener("pointermove", e => {
  if (!stick.hasPointerCapture(e.pointerId)) return;
  const r = stick.getBoundingClientRect();
  joy.x = Math.max(-1, Math.min(1, (e.clientX - r.left - 52) / 36));
  joy.y = Math.max(-1, Math.min(1, (e.clientY - r.top - 52) / 36));
  knob.style.left = 31 + joy.x * 26 + "px";
  knob.style.top = 31 + joy.y * 26 + "px";
});
stick.addEventListener("pointerup", () => { joy = { x: 0, y: 0 }; knob.style.left = "31px"; knob.style.top = "31px"; });
renderer.domElement.addEventListener("pointerdown", e => { look = true; lx = e.clientX; });
addEventListener("pointerup", () => look = false);
addEventListener("pointermove", e => { if (look) { player.yaw -= (e.clientX - lx) * 0.006; lx = e.clientX; } });
enter.onclick = () => {
  inChapel = !inChapel;
  inside.visible = inChapel;
  outside.visible = !inChapel;
  scene.background = new THREE.Color(inChapel ? 0x1a140e : 0x0e1a12);
  scene.fog = new THREE.Fog(inChapel ? 0x1a140e : 0x0e1a12, 10, 28);
  player.x = 0; player.z = inChapel ? -3.6 : 1.6; player.yaw = 0;
  enter.textContent = inChapel ? "Go out" : "Go in";
};
function loop() {
  const speed = inChapel ? 0.09 : 0.07;
  player.x += Math.sin(player.yaw) * -joy.y * speed + Math.cos(player.yaw) * joy.x * speed;
  player.z += Math.cos(player.yaw) * -joy.y * speed - Math.sin(player.yaw) * joy.x * speed;
  if (inChapel) {
    player.x = Math.max(-3.4, Math.min(3.4, player.x));
    player.z = Math.max(-4.2, Math.min(4.2, player.z));
    card.style.display = "block";
  } else {
    player.x = Math.max(-9, Math.min(9, player.x));
    player.z = Math.max(-9, Math.min(9, player.z));
    card.style.display = Math.hypot(player.x, player.z - (4.2 - 1.62)) < 1.8 ? "block" : "none";
  }
  camera.position.set(player.x, 1.6, player.z);
  camera.lookAt(player.x + Math.sin(player.yaw), 1.45, player.z + Math.cos(player.yaw));
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
