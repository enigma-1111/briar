<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Greenwood — Norham</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c140e; overflow: hidden; touch-action: none; color: #f4ead8; font: 16px Georgia, serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 14px; top: 12px; text-shadow: 0 2px 6px #000; }
  #hud a { color: #e2c27a; }
  #card { position: fixed; left: 12px; right: 12px; bottom: 124px; display: none; background: #14120ef2; border: 1px solid #e2c27a; border-radius: 14px; padding: 12px 14px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 8px 12px; margin: 6px 8px 0 0; background: #e2c27a; color: #1a140c; }
  .ghost { background: transparent; color: #e2c27a; border: 1px solid #e2c27a; }
  #stick { position: fixed; left: 16px; bottom: 16px; width: 104px; height: 104px; border-radius: 50%; border: 1px solid rgba(226,194,122,.6); touch-action: none; }
  #knob { width: 42px; height: 42px; border-radius: 50%; background: #e2c27a; position: absolute; left: 31px; top: 31px; }
</style>
</head>
<body>
<div id="hud">GREENWOOD<br><span id="where">under the oaks</span><br><a href="street.html">Back to Scarlet</a></div>
<div id="card">
  <b id="cname">Chapel</b>
  <p id="cdoes">One chapel. Town wood. Not for sale.</p>
  <button id="enter">Go in</button>
  <button id="hide">Close</button>
</div>
<div id="stick"><div id="knob"></div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1a12);
scene.fog = new THREE.Fog(0x0e1a12, 8, 36);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 80);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.AmbientLight(0x8aa888, 0.5));
scene.add(new THREE.HemisphereLight(0xb7d0a4, 0x1a2418, 0.35));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x1c3a22, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const path = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 16), new THREE.MeshStandardMaterial({ color: 0x3a3324, roughness: 1 }));
path.rotation.x = -Math.PI / 2;
path.position.y = 0.02;
scene.add(path);
function oak(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.32, 2.4, 6), new THREE.MeshStandardMaterial({ color: 0x4a3424 }));
  trunk.position.y = 1.2;
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(1.35, 8, 6), new THREE.MeshStandardMaterial({ color: 0x2f6a34 }));
  leaf.position.y = 2.7;
  g.add(trunk, leaf);
  g.position.set(x, 0, z);
  scene.add(g);
}
[[-4, -5], [4.2, -3], [-5, 1], [5, 2], [-3.4, 5], [3.6, 6], [-6, -1], [6.2, -6], [0, 8], [-2, -8], [2.4, -7]].forEach(([x, z]) => oak(x, z));
const chapel = new THREE.Group();
const stone = new THREE.MeshStandardMaterial({ color: 0x6a6258, roughness: 0.9 });
const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.2, 3.2), stone);
body.position.y = 1.1;
const roof = new THREE.Mesh(new THREE.ConeGeometry(2.1, 1.1, 4), new THREE.MeshStandardMaterial({ color: 0x2a241c }));
roof.position.y = 2.6;
roof.rotation.y = Math.PI / 4;
const door = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.15, 0.08), new THREE.MeshStandardMaterial({ color: 0x3a2416 }));
door.position.set(0, 0.58, -1.62);
const step = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.08, 0.4), stone);
step.position.set(0, 0.04, -1.9);
const lamp = new THREE.PointLight(0xffc98a, 1.4, 5);
lamp.position.set(0.7, 1.6, -1.7);
const winL = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.5), new THREE.MeshBasicMaterial({ color: 0xffd7a1 }));
winL.position.set(-0.7, 1.35, -1.61);
const winR = winL.clone();
winR.position.x = 0.7;
const board = document.createElement("canvas");
board.width = 512; board.height = 160;
const g = board.getContext("2d");
g.fillStyle = "#1c2418";
g.fillRect(0, 0, 512, 160);
g.strokeStyle = "#e2c27a";
g.lineWidth = 10;
g.strokeRect(8, 8, 496, 144);
g.fillStyle = "#f4ead8";
g.font = "72px Georgia";
g.textAlign = "center";
g.textBaseline = "middle";
g.fillText("CHAPEL", 256, 84);
const title = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.4), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(board) }));
title.position.set(0, 1.85, -1.66);
chapel.add(body, roof, door, step, lamp, winL, winR, title);
chapel.position.set(0, 0, 4.2);
scene.add(chapel);
const inside = new THREE.Group();
inside.visible = false;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 32), new THREE.MeshStandardMaterial({ color: 0x3a342c }));
floor.rotation.x = -Math.PI / 2;
inside.add(floor);
const wallMat = new THREE.MeshStandardMaterial({ color: 0x6a6258 });
[[0, 1.6, -16, 24, 3.2, 0.3], [0, 1.6, 16, 24, 3.2, 0.3], [-12, 1.6, 0, 0.3, 3.2, 32], [12, 1.6, 0, 0.3, 3.2, 32]].forEach(w => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w[3], w[4], w[5]), wallMat);
  m.position.set(w[0], w[1], w[2]);
  inside.add(m);
});
for (let i = -8; i <= 8; i += 4) {
  [-4, 4].forEach(x => {
    const pew = new THREE.Mesh(new THREE.BoxGeometry(6, 0.45, 0.7), new THREE.MeshStandardMaterial({ color: 0x4a3424 }));
    pew.position.set(x, 0.3, i);
    inside.add(pew);
  });
}
const altar = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1, 1.1), new THREE.MeshStandardMaterial({ color: 0xcbb892 }));
altar.position.set(0, 0.5, 12);
inside.add(altar);
const candle = new THREE.PointLight(0xffc98a, 2, 10);
candle.position.set(0, 1.6, 12);
inside.add(candle);
scene.add(inside);
const player = { x: 0, z: -6, yaw: 0 };
let joy = { x: 0, y: 0 }, look = false, lx = 0, inChapel = false;
const stick = document.getElementById("stick"), knob = document.getElementById("knob");
stick.addEventListener("pointerdown", e => stick.setPointerCapture(e.pointerId));
stick.addEventListener("pointermove", e => {
  if (!stick.hasPointerCapture(e.pointerId)) return;
  const r = stick.getBoundingClientRect();
  joy.x = Math.max(-1, Math.min(1, (e.clientX - r.left - 52) / 36));
  joy.y = Math.max(-1, Math.min(1, (e.clientY - r.top - 52) / 36));
  knob.style.left = 31 + joy.x * 26 + "px";
  knob.style.top = 31 + joy.y * 26 + "px";
});
stick.addEventListener("pointerup", () => { joy = { x: 0, y: 0 }; knob.style.left = "31px"; knob.style.top = "31px"; });
renderer.domElement.addEventListener("pointerdown", e => { look = true; lx = e.clientX; });
addEventListener("pointerup", () => look = false);
addEventListener("pointermove", e => { if (look) { player.yaw -= (e.clientX - lx) * 0.006; lx = e.clientX; } });
enter.onclick = () => {
  inChapel = !inChapel;
  inside.visible = inChapel;
  chapel.visible = !inChapel;
  ground.visible = !inChapel;
  path.visible = !inChapel;
  if (inChapel) { player.x = 0; player.z = -10; player.yaw = 0; }
  else { player.x = 0; player.z = 1.6; player.yaw = 0; }
  enter.textContent = inChapel ? "Go out" : "Go in";
  cdoes.textContent = inChapel ? "Inside. The room is ten times the shell. Pews, an altar, one lamp. Still not for sale." : "The door faces the path. Town wood. Not for sale.";
};
hide.onclick = () => { card.style.display = "none"; };
function loop() {
  if (!inChapel) {
    player.x += Math.sin(player.yaw) * -joy.y * 0.07 + Math.cos(player.yaw) * joy.x * 0.07;
    player.z += Math.cos(player.yaw) * -joy.y * 0.07 - Math.sin(player.yaw) * joy.x * 0.07;
    player.x = Math.max(-9, Math.min(9, player.x));
    player.z = Math.max(-9, Math.min(9, player.z));
    const doorZ = 4.2 - 1.62;
    const nearDoor = Math.hypot(player.x, player.z - doorZ) < 1.8;
    if (nearDoor) {
      cname.textContent = "Chapel";
      cdoes.textContent = "The door faces the path. Go in. Town wood. Not for sale.";
      card.style.display = "block";
      where.textContent = "at the chapel door";
    } else { card.style.display = "none"; where.textContent = "under the oaks"; }
  } else {
    player.x += Math.sin(player.yaw) * -joy.y * 0.1 + Math.cos(player.yaw) * joy.x * 0.1;
    player.z += Math.cos(player.yaw) * -joy.y * 0.1 - Math.sin(player.yaw) * joy.x * 0.1;
    player.x = Math.max(-10, Math.min(10, player.x));
    player.z = Math.max(-14, Math.min(14, player.z));
    where.textContent = "inside the chapel";
    card.style.display = "block";
  }
  camera.position.set(player.x, 1.6, player.z);
  camera.lookAt(player.x + Math.sin(player.yaw), 1.45, player.z + Math.cos(player.yaw));
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
