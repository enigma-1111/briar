<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Norham map</title>
<style>
  html, body { margin: 0; height: 100%; background: #100c18; color: #f4ead8; font: 16px/1.35 Georgia, serif; overflow: hidden; }
  canvas { display: block; }
  #top { position: fixed; left: 12px; right: 12px; top: 12px; border: 1px solid #e2c27a; border-radius: 12px; padding: 10px 12px; background: #141018ee; }
  #top b { color: #e2c27a; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #14120ef5; border-top: 1px solid #e2c27a; padding: 16px 16px 28px; transform: translateY(110%); transition: .2s; }
  #sheet.open { transform: none; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px; width: 100%; margin-top: 8px; background: #e2c27a; color: #1a140c; }
  .ghost { background: transparent; color: #e2c27a; border: 1px solid #e2c27a; }
  .muted { color: #cbb892; }
</style>
</head>
<body>
<div id="top"><div>BRIAR AT THE GATE <b id="toll">0</b></div><div class="muted">Next street: Marian · locked</div></div>
<div id="sheet">
  <b id="name"></b>
  <div class="muted" id="meta"></div>
  <p id="line"></p>
  <button id="go">Enter</button>
  <button class="ghost" id="close">Back to the map</button>
</div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const places = [
  { name:"The Gate", kind:"toll", x:0, z:0, color:0xc9a24a, line:"Swaps happen here. The city keeps a tenth." },
  { name:"Market", kind:"stalls", x:4, z:-2, color:0x6a5a40, line:"Day stalls. Not a parcel." },
  { name:"The Inn", kind:"public", x:-4, z:-1, color:0x6d5a40, line:"A hearth. Not a key." },
  { name:"Chapel", kind:"town", x:-6, z:3, color:0x3e443c, line:"Not for sale." },
  { name:"Greenwood", kind:"wood", x:-3, z:6, color:0x243024, line:"Oaks. Not a key." },
  { name:"Hearth", kind:"house", x:3, z:3, color:0x7a6248, line:"Two rooms. 50 Briar." },
  { name:"Loaf", kind:"shop", x:6, z:1, color:0x665444, line:"Floor and a back room." },
  { name:"The Cup", kind:"inn", x:5, z:5, color:0x5e5144, line:"Four beds." },
  { name:"Marian", kind:"locked", x:9, z:-3, color:0x2a313c, line:"Drawn. Not cut." },
  { name:"John", kind:"locked", x:8, z:6, color:0x2a313c, line:"Drawn. Not cut." }
];
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120c1c);
scene.fog = new THREE.Fog(0x120c1c, 18, 40);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(16, 18, 16);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.AmbientLight(0x6a6280, 0.8));
const moon = new THREE.DirectionalLight(0xffe0b0, 0.6);
moon.position.set(-8, 12, 4);
scene.add(moon);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color:0x1a1422 }));
ground.rotation.x = -Math.PI/2;
scene.add(ground);
for (let i=-8;i<=8;i++) {
  const road = new THREE.Mesh(new THREE.BoxGeometry(i%2?12:0.4, 0.05, i%2?0.4:12), new THREE.MeshStandardMaterial({ color:0x2a2433 }));
  road.position.set(i%2?0:i, 0.02, i%2?i:0);
  scene.add(road);
}
const meshes = [];
places.forEach(p => {
  const h = p.kind === "locked" ? 0.8 : 1.4 + (p.name.length % 3) * 0.4;
  const b = new THREE.Mesh(new THREE.BoxGeometry(1.3, h, 1.3), new THREE.MeshStandardMaterial({ color:p.color, emissive:p.kind==="locked"?0x000000:0x221808 }));
  b.position.set(p.x, h/2, p.z);
  b.userData = p;
  scene.add(b);
  meshes.push(b);
  const pin = new THREE.Mesh(new THREE.SphereGeometry(0.22), new THREE.MeshBasicMaterial({ color: p.kind==="locked"?0x666666:0xe2c27a }));
  pin.position.set(p.x, h+0.5, p.z);
  pin.userData = p;
  scene.add(pin);
  meshes.push(pin);
});
let yaw = 0.4;
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener("pointerdown", e => {
  ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const hit = ray.intersectObjects(meshes)[0];
  if (!hit) return;
  const p = hit.object.userData;
  name.textContent = p.name;
  meta.textContent = p.kind;
  line.textContent = p.line;
  go.textContent = p.kind === "locked" ? "Locked" : "Enter";
  go.disabled = p.kind === "locked";
  sheet.classList.add("open");
});
close.onclick = () => sheet.classList.remove("open");
go.onclick = () => {
  if (go.disabled) return;
  const n = Number(toll.textContent) + 1;
  toll.textContent = n;
  line.textContent = "You stepped in. No coin moved.";
};
function loop() {
  yaw += 0.0015;
  camera.position.set(Math.sin(yaw)*22, 16, Math.cos(yaw)*22);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
