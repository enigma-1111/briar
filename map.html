<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Norham</title>
<style>
  html, body { margin: 0; height: 100%; background: #100c18; color: #f4ead8; font: 16px/1.35 Georgia, serif; overflow: hidden; touch-action: none; }
  canvas { display: block; }
  #top { position: fixed; left: 12px; right: 12px; top: 12px; border: 1px solid #e2c27a; border-radius: 12px; padding: 10px 12px; background: #141018ee; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #14120ef5; border-top: 1px solid #e2c27a; padding: 16px 16px 28px; transform: translateY(110%); transition: .2s; }
  #sheet.open { transform: none; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px; width: 100%; margin-top: 8px; background: #e2c27a; color: #1a140c; }
  .ghost { background: transparent; color: #e2c27a; border: 1px solid #e2c27a; }
  .muted { color: #cbb892; }
</style>
</head>
<body>
<div id="top">NORHAM · <b id="count">0</b> roofs<div class="muted">Drag to turn. Tap a gold roof.</div></div>
<div id="sheet">
  <b id="name"></b>
  <div class="muted" id="meta"></div>
  <p id="line"></p>
  <button id="go">Enter</button>
  <button class="ghost" id="close">Back to the map</button>
</div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const named = [
  ["The Gate","toll",0,0,"Swaps. The city keeps a tenth."],
  ["Market","stalls",6,-4,"Day stalls. Not a parcel."],
  ["The Inn","public",-6,-2,"A hearth. Not a key."],
  ["Chapel","town",-10,4,"Not for sale."],
  ["Greenwood","wood",-8,12,"Oaks. Not a key."],
  ["Hearth","house",4,4,"Two rooms. 50 Briar."],
  ["Loaf","shop",8,2,"Floor and a back room."],
  ["The Cup","inn",6,8,"Four beds."],
  ["Quill","shop",10,6,"List an NFT."],
  ["Forge","workshop",-4,8,"Work floor. No shop."],
  ["Marian","locked",16,-6,"Drawn. Not cut."],
  ["John","locked",16,4,"Drawn. Not cut."],
  ["Much","locked",16,12,"Drawn. Not cut."],
  ["Well","town",-2,-8,"Water. Not a key."],
  ["School","town",-12,-4,"Not for sale."]
];
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120c1c);
scene.fog = new THREE.Fog(0x120c1c, 24, 70);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.AmbientLight(0x7a7090, 0.85));
const moon = new THREE.DirectionalLight(0xffe0b0, 0.45);
moon.position.set(-10, 20, 6);
scene.add(moon);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color:0x181222 }));
ground.rotation.x = -Math.PI/2;
scene.add(ground);
for (let i = -18; i <= 18; i += 4) {
  const a = new THREE.Mesh(new THREE.BoxGeometry(40, 0.04, 0.35), new THREE.MeshStandardMaterial({ color:0x2c2636 }));
  a.position.set(0, 0.02, i);
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.04, 40), new THREE.MeshStandardMaterial({ color:0x2c2636 }));
  b.position.set(i, 0.02, 0);
  scene.add(a, b);
}
const pins = [];
const stone = new THREE.MeshStandardMaterial({ color:0x4a4038 });
const lockedMat = new THREE.MeshStandardMaterial({ color:0x2a313c });
const gold = new THREE.MeshStandardMaterial({ color:0xc9a24a, emissive:0x3a2a10 });
let n = 0;
for (let x = -16; x <= 16; x += 2) {
  for (let z = -16; z <= 16; z += 2) {
    if (Math.abs(x) % 4 === 0 || Math.abs(z) % 4 === 0) continue;
    const h = 0.6 + ((x * 7 + z * 3) & 3) * 0.35;
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.1, h, 1.1), x > 12 ? lockedMat : stone);
    b.position.set(x, h/2, z);
    scene.add(b);
    n++;
  }
}
named.forEach(p => {
  const h = p[1] === "locked" ? 1 : 2.2;
  const b = new THREE.Mesh(new THREE.BoxGeometry(1.6, h, 1.6), p[1] === "locked" ? lockedMat : gold);
  b.position.set(p[2], h/2, p[3]);
  b.userData = { name:p[0], kind:p[1], line:p[4] };
  scene.add(b);
  pins.push(b);
  n++;
});
count.textContent = n;
let yaw = 0.5, drag = false, lx = 0;
renderer.domElement.addEventListener("pointerdown", e => { drag = true; lx = e.clientX; });
addEventListener("pointerup", () => drag = false);
addEventListener("pointermove", e => { if (drag) { yaw += (e.clientX - lx) * 0.005; lx = e.clientX; } });
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener("click", e => {
  ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const hit = ray.intersectObjects(pins)[0];
  if (!hit) return;
  const p = hit.object.userData;
  name.textContent = p.name;
  meta.textContent = p.kind;
  line.textContent = p.line;
  go.disabled = p.kind === "locked";
  go.textContent = p.kind === "locked" ? "Locked" : "Enter";
  sheet.classList.add("open");
});
close.onclick = () => sheet.classList.remove("open");
go.onclick = () => { if (!go.disabled) line.textContent = "You stepped in. No coin moved."; };
function loop() {
  camera.position.set(Math.sin(yaw)*28, 20, Math.cos(yaw)*28);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
