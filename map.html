<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Norham</title>
<style>
  html, body { margin: 0; height: 100%; background: #100c18; color: #f4ead8; font: 16px/1.35 Georgia, serif; overflow: hidden; touch-action: none; }
  canvas { display: block; }
  #top { position: fixed; left: 12px; right: 12px; top: 12px; border: 1px solid #e2c27a; border-radius: 12px; padding: 10px 12px; background: #141018ee; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #14120ef5; border-top: 1px solid #e2c27a; padding: 16px 16px 28px; transform: translateY(110%); transition: .2s; }
  #sheet.open { transform: none; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px; width: 100%; margin-top: 8px; background: #e2c27a; color: #1a140c; }
  button:disabled { background: #2a313c; color: #8a8478; }
  .ghost { background: transparent; color: #e2c27a; border: 1px solid #e2c27a; }
  .muted { color: #cbb892; }
</style>
</head>
<body>
<div id="top">NORHAM · <b id="count">0</b> deployed<div class="muted">The Gate is the center. Scarlet doors are gold. Marian, John, and Much are drawn and locked.</div></div>
<div id="sheet">
  <b id="name"></b>
  <div class="muted" id="meta"></div>
  <p id="line"></p>
  <button id="go">Enter</button>
  <button class="ghost" id="close">Back to the map</button>
</div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const scarlet = [
  ["Hearth","door",-2,6,"Scarlet. Two rooms. Open. First out from the Gate."],
  ["Loaf","door",2,10,"Scarlet. Floor and a back room."],
  ["The Cup","door",-2,14,"Scarlet. Four beds. A week rent."],
  ["Quill","door",2,18,"Scarlet. A counter."],
  ["Forge","door",-2,22,"Scarlet. Work floor."],
  ["Last Door","door",2,26,"Scarlet. End of the street."]
];
const lockedStreets = [
  ["Marian","locked",8,8,"Drawn. Eighteen shutters. Not cut."],
  ["John","locked",12,18,"Drawn. Eighteen shutters. Not cut."],
  ["Much","locked",16,26,"Drawn. Sixteen shutters and a mill. Not cut."]
];
const town = [
  ["The Gate","town",0,0,"A note, not a swap. The city keeps a tenth. No coin moves."],
  ["Well","town",0,28,"Water. Not a key."],
  ["Market","stall",-6,10,"Apple, Cloth, Salt, Wick. A day list. Not a parcel."],
  ["Greenwood","wood",-8,-6,"Oaks and one chapel. Walk. Not for sale."]
];
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120c1c);
scene.fog = new THREE.Fog(0x120c1c, 24, 70);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.AmbientLight(0x7a7090, 0.85));
const moon = new THREE.DirectionalLight(0xffe0b0, 0.45);
moon.position.set(-10, 20, 6);
scene.add(moon);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color:0x181222 }));
ground.rotation.x = -Math.PI/2;
scene.add(ground);
const road = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.06, 32), new THREE.MeshStandardMaterial({ color:0x3a332b }));
road.position.set(0, 0.03, 14);
scene.add(road);
for (const x of [8, 12, 16]) {
  const lane = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.04, 24), new THREE.MeshStandardMaterial({ color:0x241e28 }));
  lane.position.set(x, 0.02, 16);
  scene.add(lane);
}
const pins = [];
const stone = new THREE.MeshStandardMaterial({ color:0x4a4038 });
const lockedMat = new THREE.MeshStandardMaterial({ color:0x2a313c });
const gold = new THREE.MeshStandardMaterial({ color:0xe2c27a, emissive:0x5a4010, emissiveIntensity:0.35 });
const townMat = new THREE.MeshStandardMaterial({ color:0x6a6258 });
const woodMat = new THREE.MeshStandardMaterial({ color:0x2f6a34, emissive:0x143018, emissiveIntensity:0.4 });
let n = 0;
for (let x = -14; x <= 14; x += 4) {
  for (let z = -12; z <= 14; z += 4) {
    if (Math.abs(x) < 3) continue;
    const locked = x >= 8;
    const h = locked ? 0.45 : 0.7;
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.4, h, 1.4), locked ? lockedMat : stone);
    b.position.set(x, h/2, z);
    scene.add(b);
  }
}
function pin(p, mat, h) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(1.5, h, 1.5), mat);
  b.position.set(p[2], h/2, p[3]);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.7, 0.08), p[1] === "door" ? gold : lockedMat);
  door.position.set(p[2], 0.4, p[3] + 0.78);
  b.userData = { name:p[0], kind:p[1], line:p[4] };
  scene.add(b, door);
  pins.push(b);
  if (p[1] === "door") n++;
}
scarlet.forEach(p => pin(p, gold, 2.1));
lockedStreets.forEach(p => pin(p, lockedMat, 0.8));
town.forEach(p => pin(p, p[1] === "wood" ? woodMat : townMat, 1.6));
count.textContent = n;
let yaw = 0.6, drag = false, lx = 0, moved = false, picked = null;
renderer.domElement.addEventListener("pointerdown", e => { drag = true; moved = false; lx = e.clientX; });
addEventListener("pointerup", () => drag = false);
addEventListener("pointermove", e => { if (drag) { const d = e.clientX - lx; if (Math.abs(d) > 3) moved = true; yaw += d * 0.005; lx = e.clientX; } });
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener("click", e => {
  if (moved) return;
  ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const hit = ray.intersectObjects(pins)[0];
  if (!hit) return;
  const p = hit.object.userData;
  picked = p;
  name.textContent = p.name;
  meta.textContent = p.kind === "door" ? "Scarlet · deployed" : p.kind === "wood" ? "town wood · not for sale" : p.kind === "locked" ? "locked street · not cut" : "town";
  line.textContent = p.line;
  go.disabled = p.kind !== "door" && p.kind !== "wood" && p.kind !== "stall" && p.kind !== "locked";
  go.textContent = p.kind === "door" ? "Walk Scarlet" : p.kind === "wood" ? "Walk the Greenwood" : p.kind === "stall" ? "Walk the stalls" : p.kind === "locked" ? "Look down the street" : (p.name === "The Gate" ? "Note only" : "Locked");
  sheet.classList.add("open");
});
close.onclick = () => sheet.classList.remove("open");
go.onclick = () => {
  if (go.disabled || !picked) return;
  if (picked.kind === "wood") location.href = "greenwood.html";
  else if (picked.kind === "locked") location.href = "locked.html?street=" + encodeURIComponent(picked.name);
  else location.href = "street.html";
};
function loop() {
  camera.position.set(Math.sin(yaw)*26, 16, Math.cos(yaw)*26);
  camera.lookAt(0, 0, 8);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
