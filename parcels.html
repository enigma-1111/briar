<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Norham parcels</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141c; overflow: hidden; touch-action: none; color: #f4ead8; font: 16px Georgia, serif; }
  canvas { display: block; }
  #card { position: fixed; left: 12px; right: 12px; bottom: 124px; display: none; background: #14120ef2; border: 1px solid #e2c27a; border-radius: 14px; padding: 12px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 8px 12px; margin: 8px 8px 0 0; background: #e2c27a; color: #1a140c; }
  .ghost { background: transparent; color: #e2c27a; border: 1px solid #e2c27a; }
  #stick { position: fixed; left: 16px; bottom: 16px; width: 104px; height: 104px; border-radius: 50%; border: 1px solid rgba(226,194,122,.6); }
  #knob { width: 42px; height: 42px; border-radius: 50%; background: #e2c27a; position: absolute; left: 31px; top: 31px; }
  .muted { color: #cbb892; }
</style>
</head>
<body>
<div id="card"><b id="cname"></b><div class="muted" id="cmeta"></div><div id="cdoes"></div>
  <button id="place">Place one block</button><button id="bed" style="display:none">Rent a bed</button><button id="settle" style="display:none">Settle</button><button id="loft" style="display:none">Loft</button><button id="carry" style="display:none">Note the week</button><button class="ghost" id="hide">Close</button></div>
<div id="stick"><div id="knob"></div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const KEY = "briar.scarlet.blocks.v1";
const CARRY = "briar.scarlet.carry.v1";
const KEYS = ["Hearth", "Loaf", "The Cup", "Quill", "Forge"];
const BED = "briar.cup.bed.v1";
const ROOM = "briar.hearth.rooms.v1";
const WEEK = 7 * 24 * 60 * 60 * 1000;
const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
function carryBook() {
  try { return JSON.parse(localStorage.getItem(CARRY) || "{}"); } catch (e) { return {}; }
}
function isKey(name) { return KEYS.indexOf(name) !== -1; }
function restCarry(name) {
  const book = carryBook();
  if (book[name]) { delete book[name]; localStorage.setItem(CARRY, JSON.stringify(book)); }
}
function carryDue(name) {
  if (!isKey(name) || saved[name]) return 0;
  const book = carryBook();
  if (!book[name] || !book[name].since) {
    book[name] = { since: Date.now(), noted: 0 };
    localStorage.setItem(CARRY, JSON.stringify(book));
  }
  return Math.max(1, Math.ceil((Date.now() - book[name].since) / WEEK));
}
function carryLine(name) {
  if (!isKey(name)) return "";
  if (saved[name]) return " Occupied. The carry rests.";
  return " Empty key. Carrying fee: one wick a week. Due: " + carryDue(name) + ". Nothing is taken.";
}
function bedHeld() {
  try {
    const b = JSON.parse(localStorage.getItem(BED) || "null");
    if (!b || b.place !== "The Cup" || !b.until || b.until < Date.now()) return null;
    return b;
  } catch (e) { return null; }
}
function bedDays(b) {
  return Math.max(1, Math.ceil((b.until - Date.now()) / 86400000));
}
function roomBook() {
  try {
    const b = JSON.parse(localStorage.getItem(ROOM) || "{}");
    const out = {};
    ["Settle", "Loft"].forEach(n => { if (b[n] && b[n] > Date.now()) out[n] = b[n]; });
    return out;
  } catch (e) { return {}; }
}
function roomDays(until) {
  return Math.max(1, Math.ceil((until - Date.now()) / 86400000));
}
function paintRooms() {
  const book = roomBook();
  settle.textContent = book.Settle ? ("Settle · " + roomDays(book.Settle) + "d") : "Settle";
  loft.textContent = book.Loft ? ("Loft · " + roomDays(book.Loft) + "d") : "Loft";
}
const parcels = [
  ["The Inn","town",-4,0,0x6d5a40,"Public. Not a parcel you can buy."],
  ["Hearth","house",-4,0,0x7a6248,"Two rooms: Settle and Loft. A week rent. The box stays with the key."],
  ["Loaf","shop",4,0,0x665444,"Floor and back room."],
  ["The Cup","inn",8,0,0x5e5144,"4 beds. A week rent. The box stays with the key."],
  ["Chapel","town",-4,5,0x3e443c,"Not for sale."],
  ["Market","town",2,5,0x5c5346,"Stalls. Not a key."],
  ["Gate","toll",0,0,0xc9a24a,"A note, not a swap. The city keeps a tenth. No coin moves."]
];
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2430);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 60);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 20), new THREE.MeshLambertMaterial({ color:0x2f5d3a }));
ground.rotation.x = -Math.PI/2;
scene.add(ground);
function blocks(color) {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color });
  for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) for (let z = 0; z < 3; z++) {
    if (y === 1 && x === 1 && z === 2) continue;
    const cube = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), mat);
    cube.position.set(x - 1, y * 0.95 + 0.45, z - 1);
    g.add(cube);
  }
  return g;
}
function putBlock(group) {
  if (group.getObjectByName("walker-block")) return;
  const cube = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), new THREE.MeshLambertMaterial({ color: 0xe2c27a }));
  cube.name = "walker-block";
  cube.position.set(0, 3.3, 0);
  group.add(cube);
}
const meshes = parcels.map(p => {
  const g = blocks(p[4]);
  g.position.set(p[2], 0, p[3]);
  g.userData = { name:p[0], kind:p[1], does:p[5] };
  if (saved[p[0]] && p[1] !== "town" && p[1] !== "toll") putBlock(g);
  scene.add(g);
  return g;
});
const player = { x: 0, z: -5, yaw: 0 };
let joy = { x:0, y:0 }, look = false, lx = 0, selected = null;
const stick = document.getElementById("stick"), knob = document.getElementById("knob");
stick.addEventListener("pointerdown", e => stick.setPointerCapture(e.pointerId));
stick.addEventListener("pointermove", e => {
  if (!stick.hasPointerCapture(e.pointerId)) return;
  const r = stick.getBoundingClientRect();
  joy.x = Math.max(-1, Math.min(1, (e.clientX-r.left-52)/36));
  joy.y = Math.max(-1, Math.min(1, (e.clientY-r.top-52)/36));
  knob.style.left = 31+joy.x*26+"px"; knob.style.top = 31+joy.y*26+"px";
});
stick.addEventListener("pointerup", () => { joy={x:0,y:0}; knob.style.left="31px"; knob.style.top="31px"; });
renderer.domElement.addEventListener("pointerdown", e => {
  look = true; lx = e.clientX;
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const hit = ray.intersectObjects(meshes, true)[0];
  if (!hit) return;
  selected = hit.object.parent;
  cname.textContent = selected.userData.name;
  cmeta.textContent = selected.userData.kind + " parcel";
  cdoes.textContent = selected.userData.does + carryLine(selected.userData.name);
  carry.style.display = isKey(selected.userData.name) && !saved[selected.userData.name] ? "inline-block" : "none";
  if (isKey(selected.userData.name) && !saved[selected.userData.name]) carry.textContent = "Note the week · " + carryDue(selected.userData.name);
  place.textContent = (selected.userData.kind === "town" || selected.userData.kind === "toll") ? "Town refuses" : (saved[selected.userData.name] ? "Block set" : "Place one block");
  const cup = selected.userData.name === "The Cup";
  bed.style.display = cup ? "inline-block" : "none";
  if (cup) {
    const held = bedHeld();
    bed.textContent = held ? ("Bed held · " + bedDays(held) + "d") : "Rent a bed";
    if (held) cdoes.textContent = "Bed held for " + bedDays(held) + " day" + (bedDays(held) === 1 ? "" : "s") + ". The box is not yours.";
  }
  const hearth = selected.userData.name === "Hearth";
  settle.style.display = hearth ? "inline-block" : "none";
  loft.style.display = hearth ? "inline-block" : "none";
  if (hearth) {
    paintRooms();
    const book = roomBook();
    const held = ["Settle", "Loft"].filter(n => book[n]).map(n => n + " · " + roomDays(book[n]) + "d");
    if (held.length) cdoes.textContent = held.join(". ") + ". A room, not the box.";
  }
  card.style.display = "block";
});
addEventListener("pointerup", () => look = false);
addEventListener("pointermove", e => { if (look) { player.yaw -= (e.clientX-lx)*0.006; lx = e.clientX; } });
function rentRoom(name) {
  if (!selected || selected.userData.name !== "Hearth") return;
  const book = roomBook();
  if (book[name]) {
    cdoes.textContent = name + " already held for " + roomDays(book[name]) + " day" + (roomDays(book[name]) === 1 ? "" : "s") + ". The box is not yours.";
    return;
  }
  book[name] = Date.now() + WEEK;
  localStorage.setItem(ROOM, JSON.stringify(book));
  cdoes.textContent = name + " rented for a week. A room, not the box. Saved on this browser.";
  paintRooms();
}
settle.onclick = () => rentRoom("Settle");
loft.onclick = () => rentRoom("Loft");
bed.onclick = () => {
  if (!selected || selected.userData.name !== "The Cup") return;
  const held = bedHeld();
  if (held) {
    cdoes.textContent = "Bed already held for " + bedDays(held) + " day" + (bedDays(held) === 1 ? "" : "s") + ". The box is not yours.";
    return;
  }
  localStorage.setItem(BED, JSON.stringify({ place: "The Cup", until: Date.now() + WEEK }));
  cdoes.textContent = "Bed rented for a week. Saved on this browser. The box stays closed.";
  bed.textContent = "Bed held · 7d";
};
hide.onclick = () => card.style.display = "none";
place.onclick = () => {
  if (!selected) return;
  const kind = selected.userData.kind;
  if (kind === "town" || kind === "toll") {
    cdoes.textContent = "Town parcel. The block is refused.";
    return;
  }
  if (saved[selected.userData.name]) {
    cdoes.textContent = "One block already sits on " + selected.userData.name + ".";
    return;
  }
  putBlock(selected);
  saved[selected.userData.name] = 1;
  localStorage.setItem(KEY, JSON.stringify(saved));
  restCarry(selected.userData.name);
  carry.style.display = "none";
  cdoes.textContent = "One block placed. Occupied. The carry rests. Saved on this browser.";
  place.textContent = "Block set";
};
carry.onclick = () => {
  if (!selected || !isKey(selected.userData.name) || saved[selected.userData.name]) return;
  const book = carryBook();
  const row = book[selected.userData.name] || { since: Date.now(), noted: 0 };
  row.noted = (row.noted || 0) + 1;
  book[selected.userData.name] = row;
  localStorage.setItem(CARRY, JSON.stringify(book));
  cdoes.textContent = "Week noted on " + selected.userData.name + ". Still nothing taken. Due: " + carryDue(selected.userData.name) + ".";
};
function loop() {
  player.x += Math.sin(player.yaw)*-joy.y*0.08 + Math.cos(player.yaw)*joy.x*0.08;
  player.z += Math.cos(player.yaw)*-joy.y*0.08 - Math.sin(player.yaw)*joy.x*0.08;
  camera.position.set(player.x, 1.6, player.z);
  camera.lookAt(player.x+Math.sin(player.yaw), 1.4, player.z+Math.cos(player.yaw));
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
