<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Norham</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; left: 16px; right: 16px; top: 14px; color: #f4ead8; font: 16px/1.3 Georgia, serif; text-shadow: 0 1px 4px #000; pointer-events: none; }
  #enter { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); display: none; border: 0; border-radius: 999px; padding: 12px 18px; background: #e2c27a; color: #1a140c; font: 17px Georgia, serif; }
  #stick { position: fixed; left: 18px; bottom: 18px; width: 110px; height: 110px; border-radius: 50%; border: 1px solid rgba(226,194,122,.5); }
  #knob { width: 46px; height: 46px; border-radius: 50%; background: rgba(226,194,122,.8); position: absolute; left: 32px; top: 32px; }
</style>
</head>
<body>
<div id="hud">NORHAM<br><span id="where">Scarlet</span></div>
<button id="enter">Go in</button>
<div id="stick"><div id="knob"></div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141c);
scene.fog = new THREE.Fog(0x10141c, 8, 36);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 80);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x667088, 0.55));
const lamp = new THREE.PointLight(0xffb15a, 8, 16);
lamp.position.set(0, 3, 0);
scene.add(lamp);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x2a241c, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
function house(x, z, name, color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.4, 3.2), new THREE.MeshStandardMaterial({ color }));
  body.position.y = 1.2;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.4, 1.2, 4), new THREE.MeshStandardMaterial({ color: 0x1c140e }));
  roof.position.y = 2.8;
  roof.rotation.y = Math.PI / 4;
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.3, 0.1), new THREE.MeshStandardMaterial({ color: 0x5a3b22 }));
  door.position.set(0, 0.65, 1.62);
  g.add(body, roof, door);
  g.position.set(x, 0, z);
  g.userData = { name };
  scene.add(g);
  return g;
}
const places = [
  house(-4, -2, "The Inn", 0x6d5a40),
  house(4, -2, "Loaf", 0x7a6248),
  house(-4, 6, "The Cup", 0x5e5144),
  house(4, 6, "Hearth", 0x6a5846)
];
const trees = new THREE.Mesh(new THREE.SphereGeometry(1.4, 8, 6), new THREE.MeshStandardMaterial({ color: 0x1d2a1c }));
trees.position.set(-8, 1.2, 8);
scene.add(trees);
const player = { x: 0, z: 2, yaw: 0 };
const keys = {};
let joy = { x: 0, y: 0 };
let inside = null;
addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
const stick = document.getElementById("stick");
const knob = document.getElementById("knob");
stick.addEventListener("pointerdown", e => stick.setPointerCapture(e.pointerId));
stick.addEventListener("pointermove", e => {
  if (!stick.hasPointerCapture(e.pointerId)) return;
  const r = stick.getBoundingClientRect();
  joy.x = Math.max(-1, Math.min(1, (e.clientX - r.left - 55) / 40));
  joy.y = Math.max(-1, Math.min(1, (e.clientY - r.top - 55) / 40));
  knob.style.left = 32 + joy.x * 28 + "px";
  knob.style.top = 32 + joy.y * 28 + "px";
});
function resetJoy() { joy = { x: 0, y: 0 }; knob.style.left = "32px"; knob.style.top = "32px"; }
stick.addEventListener("pointerup", resetJoy);
let look = false, lx = 0;
renderer.domElement.addEventListener("pointerdown", e => { if (e.clientX < 140 && e.clientY > innerHeight - 150) return; look = true; lx = e.clientX; });
addEventListener("pointerup", () => look = false);
addEventListener("pointermove", e => { if (!look) return; player.yaw -= (e.clientX - lx) * 0.005; lx = e.clientX; });
const enter = document.getElementById("enter");
const where = document.getElementById("where");
enter.onclick = () => {
  if (!near) return;
  inside = inside ? null : near;
  where.textContent = inside ? inside.userData.name : "Scarlet";
  enter.textContent = inside ? "Go out" : "Go in";
};
let near = null;
function loop() {
  const forward = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0) - joy.y;
  const side = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0) + joy.x;
  if (!inside) {
    player.x += Math.sin(player.yaw) * forward * 0.06 + Math.cos(player.yaw) * side * 0.06;
    player.z += Math.cos(player.yaw) * forward * 0.06 - Math.sin(player.yaw) * side * 0.06;
    player.x = Math.max(-10, Math.min(10, player.x));
    player.z = Math.max(-8, Math.min(12, player.z));
  }
  near = places.find(p => Math.hypot(p.position.x - player.x, p.position.z - player.z) < 2.4) || null;
  enter.style.display = near ? "block" : "none";
  const eye = inside ? 1.4 : 1.6;
  const px = inside ? inside.position.x : player.x;
  const pz = inside ? inside.position.z : player.z;
  camera.position.set(px, eye, pz);
  camera.lookAt(px + Math.sin(player.yaw), eye, pz + Math.cos(player.yaw));
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
