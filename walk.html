<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Norham</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; touch-action: none; color: #f4ead8; font: 16px/1.35 Georgia, serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 14px; top: 12px; text-shadow: 0 1px 4px #000; pointer-events: none; }
  #card { position: fixed; left: 12px; right: 12px; bottom: 128px; background: #14120ef2; border: 1px solid #4a3d28; border-radius: 14px; padding: 12px 14px; display: none; }
  .muted { color: #cbb892; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 8px 12px; margin: 8px 8px 0 0; background: #e2c27a; color: #1a140c; }
  .ghost { background: transparent; color: #e2c27a; border: 1px solid #e2c27a; }
  #stick { position: fixed; left: 16px; bottom: 16px; width: 104px; height: 104px; border-radius: 50%; border: 1px solid rgba(226,194,122,.55); z-index: 2; }
  #knob { width: 42px; height: 42px; border-radius: 50%; background: rgba(226,194,122,.9); position: absolute; left: 31px; top: 31px; }
</style>
</head>
<body>
<div id="hud">NORHAM<br><span id="where">Scarlet</span></div>
<div id="card"><b id="cname"></b><div class="muted" id="cmeta"></div><div id="cdoes"></div>
  <button id="go">Go in</button><button id="act">Take</button><button class="ghost" id="hide">Close</button></div>
<div id="stick"><div id="knob"></div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const save = JSON.parse(localStorage.getItem("briar.walkcity.v1") || "{}");
const places = [
  ["The Inn","town",-8,-6,0x6d5a40,"Public hearth. Not a key."],
  ["Market","town",0,-8,0x5c5346,"Day stalls. Not a parcel."],
  ["Gate","town",0,0,0xc9a24a,"A note, not a swap. The city keeps a tenth. No coin moves."],
  ["Chapel","town",-10,2,0x3d4038,"One room. Not for sale."],
  ["Greenwood","town",-12,8,0x243024,"Oaks. Not a key."],
  ["Hearth","house",6,-6,0x7a6248,"Two rooms. 50 Briar."],
  ["Loaf","shop",6,-2,0x6a5846,"Floor and back room. 70 Briar."],
  ["The Cup","inn",6,2,0x5e5144,"Four beds. 160 Briar."],
  ["Quill","shop",6,6,0x685444,"List an NFT. 80 Briar."],
  ["Forge","workshop",-6,6,0x4e463c,"Work floor. No shop."],
  ["Marian","later",12,-4,0x2a313c,"Drawn. Not cut."],
  ["John","later",12,2,0x2a313c,"Drawn. Not cut."],
  ["Much","later",12,8,0x2a313c,"Drawn. Not cut."]
].map(p => ({ name:p[0], kind:p[1], x:p[2], z:p[3], color:p[4], does:p[5], holder: save[p[0]] || (p[1]==="town"||p[1]==="later"?"Norham":"open") }));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12151c);
scene.fog = new THREE.Fog(0x12151c, 14, 42);
const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 80);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.AmbientLight(0x8a93a8, 0.8));
const warm = new THREE.PointLight(0xffb15a, 8, 24);
warm.position.set(0, 5, 0);
scene.add(warm);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(48, 48), new THREE.MeshStandardMaterial({ color:0x241f19 }));
ground.rotation.x = -Math.PI/2;
scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(4, 28), new THREE.MeshStandardMaterial({ color:0x3a3228 }));
road.rotation.x = -Math.PI/2;
road.position.y = 0.02;
scene.add(road);
const meshes = places.map(p => {
  const g = new THREE.Group();
  const h = p.kind === "later" ? 1.4 : 2.6;
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, h, 3), new THREE.MeshStandardMaterial({ color:p.color }));
  body.position.y = h/2;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.3, 0.9, 4), new THREE.MeshStandardMaterial({ color:0x1b140f }));
  roof.position.y = h + 0.4;
  roof.rotation.y = Math.PI/4;
  g.add(body, roof);
  g.position.set(p.x, 0, p.z);
  g.userData = p;
  scene.add(g);
  return g;
});
const player = { x:0, z:-5, yaw:0 };
let joy={x:0,y:0}, look=false, lx=0, selected=null, inside=false;
const stick=document.getElementById("stick"), knob=document.getElementById("knob");
stick.addEventListener("pointerdown", e => stick.setPointerCapture(e.pointerId));
stick.addEventListener("pointermove", e => {
  if (!stick.hasPointerCapture(e.pointerId)) return;
  const r = stick.getBoundingClientRect();
  joy.x = Math.max(-1, Math.min(1, (e.clientX-r.left-52)/36));
  joy.y = Math.max(-1, Math.min(1, (e.clientY-r.top-52)/36));
  knob.style.left = 31+joy.x*26+"px"; knob.style.top = 31+joy.y*26+"px";
});
stick.addEventListener("pointerup", () => { joy={x:0,y:0}; knob.style.left="31px"; knob.style.top="31px"; });
renderer.domElement.addEventListener("pointerdown", e => {
  look = true; lx = e.clientX;
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const hit = ray.intersectObjects(meshes, true)[0];
  if (!hit) return;
  selected = hit.object.parent;
  const p = selected.userData;
  cname.textContent = p.name;
  cmeta.textContent = p.kind === "town" ? "town place" : p.kind === "later" ? "not cut" : p.kind + " · " + p.holder;
  cdoes.textContent = p.does;
  act.style.display = p.kind === "house" || p.kind === "shop" || p.kind === "inn" ? "inline-block" : "none";
  act.textContent = p.holder === "open" ? "Take key" : "Held";
  act.disabled = p.holder !== "open";
  go.textContent = "Go in";
  card.style.display = "block";
  inside = false;
});
addEventListener("pointerup", () => look = false);
addEventListener("pointermove", e => { if (look) { player.yaw -= (e.clientX-lx)*0.006; lx = e.clientX; } });
hide.onclick = () => { card.style.display = "none"; selected = null; inside = false; where.textContent = "Scarlet"; };
go.onclick = () => {
  if (!selected) return;
  inside = !inside;
  where.textContent = inside ? selected.userData.name : "Scarlet";
  go.textContent = inside ? "Go out" : "Go in";
  cdoes.textContent = inside ? "Inside. A bed and a box. The box opens only for the key." : selected.userData.does;
};
act.onclick = () => {
  if (!selected || selected.userData.holder !== "open") return;
  selected.userData.holder = "you";
  save[selected.userData.name] = "you";
  localStorage.setItem("briar.walkcity.v1", JSON.stringify(save));
  cdoes.textContent = "Key saved on this phone. No coin moved.";
  act.disabled = true;
};
function loop() {
  if (!inside) {
    player.x += Math.sin(player.yaw)*-joy.y*0.09 + Math.cos(player.yaw)*joy.x*0.09;
    player.z += Math.cos(player.yaw)*-joy.y*0.09 - Math.sin(player.yaw)*joy.x*0.09;
    player.x = Math.max(-14, Math.min(16, player.x));
    player.z = Math.max(-12, Math.min(14, player.z));
  }
  const px = inside && selected ? selected.position.x : player.x;
  const pz = inside && selected ? selected.position.z : player.z;
  camera.position.set(px, 1.6, pz);
  camera.lookAt(px+Math.sin(player.yaw), 1.5, pz+Math.cos(player.yaw));
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
