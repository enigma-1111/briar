<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scarlet — Norham</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c140e; overflow: hidden; touch-action: none; color: #f4ead8; font: 16px Georgia, serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 14px; top: 12px; z-index: 5; text-shadow: 0 2px 6px #000; pointer-events: none; }
  #hud a { color: #e2c27a; pointer-events: auto; }
  #card { position: fixed; left: 12px; right: 128px; top: 72px; z-index: 6; display: none; background: #14120ef2; border: 1px solid #e2c27a; border-radius: 14px; padding: 12px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 8px 12px; margin: 6px 6px 0 0; background: #e2c27a; color: #1a140c; }
  #stick, #lookpad { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%; z-index: 9; touch-action: none; }
  #stick { left: 16px; border: 1px solid rgba(226,194,122,.7); }
  #lookpad { right: 16px; border: 1px dashed rgba(226,194,122,.5); }
  #knob { width: 42px; height: 42px; border-radius: 50%; background: #e2c27a; position: absolute; left: 31px; top: 31px; }
</style>
</head>
<body>
<div id="hud">SCARLET<br><span id="where">on the cobbles</span><br><a href="index.html">Town</a></div>
<div id="card"><b id="cname"></b><p id="cdoes"></p><button id="hide">Close</button></div>
<div id="stick"><div id="knob"></div></div>
<div id="lookpad"></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c140e);
scene.fog = new THREE.Fog(0x0c140e, 8, 28);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 40);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "low-power" });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb7c4a4, 0x1a2418, 0.9));
scene.add(new THREE.AmbientLight(0xffe0b0, 0.15));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(16, 36), new THREE.MeshLambertMaterial({ color: 0x1a2a18 }));
ground.rotation.x = -Math.PI / 2;
const road = new THREE.Mesh(new THREE.PlaneGeometry(6, 34), new THREE.MeshLambertMaterial({ color: 0x3a3328 }));
road.rotation.x = -Math.PI / 2;
road.position.y = 0.01;
scene.add(ground, road);
const doors = [];
const solids = [];
function house(x, z, color, name, line) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.6, 2.2, 2.4), new THREE.MeshLambertMaterial({ color }));
  body.position.y = 1.1;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2, 0.8, 4), new THREE.MeshLambertMaterial({ color: 0x1b140f }));
  roof.position.y = 2.5;
  roof.rotation.y = Math.PI / 4;
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 0.08), new THREE.MeshLambertMaterial({ color: 0x2a2118 }));
  door.position.set(0, 0.5, x > 0 ? -1.22 : 1.22);
  g.add(body, roof, door);
  g.position.set(x, 0, z);
  scene.add(g);
  solids.push({ x, z, w: 1.4, d: 1.3 });
  doors.push({ x, z: z + (x > 0 ? -1.5 : 1.5), name, line });
}
house(-2.8, -8, 0xc4b49a, "Hearth", "Settle and Loft.");
house(2.8, -4, 0x8a5a48, "Loaf", "Floor and a back room.");
house(-2.8, 0, 0x6e5344, "The Cup", "Four beds.");
house(2.8, 4, 0xb7a48c, "Quill", "A counter.");
house(-2.8, 8, 0x4e4036, "Forge", "Work floor.");
const lamp = new THREE.PointLight(0xffc98a, 0.8, 12);
lamp.position.set(0, 3, 0);
scene.add(lamp);
const player = { x: 0, z: -11, yaw: 0, pitch: 0 };
const cloakMat = new THREE.MeshLambertMaterial({ color: 0xcbb892 });
const walker = new THREE.Group();
const cloak = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1, 6), cloakMat);
cloak.position.y = 0.7;
const hood = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), cloakMat);
hood.position.y = 1.25;
walker.add(cloak, hood);
scene.add(walker);
let joy = { x: 0, y: 0 }, look = false, lx = 0, ly = 0, stickOn = false;
const stick = document.getElementById("stick"), knob = document.getElementById("knob"), lookpad = document.getElementById("lookpad");
function resetStick() { stickOn = false; joy = { x: 0, y: 0 }; knob.style.left = "31px"; knob.style.top = "31px"; }
stick.addEventListener("pointerdown", e => { stickOn = true; stick.setPointerCapture(e.pointerId); });
stick.addEventListener("pointermove", e => {
  if (!stickOn) return;
  const r = stick.getBoundingClientRect();
  joy.x = Math.max(-1, Math.min(1, (e.clientX - r.left - 52) / 36));
  joy.y = Math.max(-1, Math.min(1, (e.clientY - r.top - 52) / 36));
  knob.style.left = 31 + joy.x * 26 + "px";
  knob.style.top = 31 + joy.y * 26 + "px";
});
stick.addEventListener("pointerup", resetStick);
stick.addEventListener("pointercancel", resetStick);
lookpad.addEventListener("pointerdown", e => { look = true; lx = e.clientX; ly = e.clientY; lookpad.setPointerCapture(e.pointerId); });
lookpad.addEventListener("pointermove", e => {
  if (!look) return;
  player.yaw += (e.clientX - lx) * 0.008;
  player.pitch = Math.max(-0.6, Math.min(0.6, player.pitch + (e.clientY - ly) * 0.005));
  lx = e.clientX; ly = e.clientY;
});
function resetLook() { look = false; player.pitch = 0; }
lookpad.addEventListener("pointerup", resetLook);
lookpad.addEventListener("pointercancel", resetLook);
hide.onclick = () => card.style.display = "none";
function blocked(x, z) { return solids.some(s => Math.abs(x - s.x) < s.w && Math.abs(z - s.z) < s.d); }
function loop() {
  const nx = player.x + Math.sin(player.yaw) * -joy.y * 0.08 + Math.cos(player.yaw) * -joy.x * 0.08;
  const nz = player.z + Math.cos(player.yaw) * -joy.y * 0.08 + Math.sin(player.yaw) * joy.x * 0.08;
  if (!blocked(nx, player.z) && Math.abs(nx) < 2.6) player.x = nx;
  if (!blocked(player.x, nz) && nz > -13 && nz < 12) player.z = nz;
  const near = doors.find(d => Math.hypot(d.x - player.x, d.z - player.z) < 1.6);
  if (near) { cname.textContent = near.name; cdoes.textContent = near.line; card.style.display = "block"; where.textContent = near.name; }
  else if (card.style.display === "block" && !near) { card.style.display = "none"; where.textContent = "on the cobbles"; }
  walker.position.set(player.x, 0, player.z);
  walker.rotation.y = player.yaw;
  const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw);
  camera.position.set(player.x - fx * 2.2, 1.7, player.z - fz * 2.2);
  camera.lookAt(player.x + fx, 1.2 - player.pitch, player.z + fz);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
