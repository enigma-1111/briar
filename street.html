<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scarlet — Norham</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; touch-action: none; color: #f4ead8; font: 16px Georgia, serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 14px; top: 12px; text-shadow: 0 2px 6px #000; pointer-events: none; }
  #card { position: fixed; left: 12px; right: 12px; bottom: 124px; display: none; background: #14120ef2; border: 1px solid #e2c27a; border-radius: 14px; padding: 12px 14px; }
  #card p { margin: 6px 0 10px; color: #e8dcc4; }
  button, #good { font: inherit; border: 0; border-radius: 999px; padding: 8px 12px; margin: 0 8px 8px 0; background: #e2c27a; color: #1a140c; }
  #good { display: none; width: 160px; background: #1a1612; color: #f4ead8; border: 1px solid #e2c27a; }
  #stick { position: fixed; left: 16px; bottom: 16px; width: 104px; height: 104px; border-radius: 50%; border: 1px solid rgba(226,194,122,.6); touch-action: none; }
  #knob { width: 42px; height: 42px; border-radius: 50%; background: #e2c27a; position: absolute; left: 31px; top: 31px; }
</style>
</head>
<body>
<div id="hud">SCARLET<br><span id="where">on the cobbles</span></div>
<div id="card">
  <b id="cname"></b>
  <p id="cdoes"></p>
  <button id="place">Place one block</button>
  <button id="bed" style="display:none">Rent a bed</button>
  <button id="settle" style="display:none">Settle</button>
  <button id="loft" style="display:none">Loft</button>
  <input id="good" maxlength="32" placeholder="one good">
  <button id="list" style="display:none">List for the day</button>
  <button id="hide">Close</button>
</div>
<div id="stick"><div id="knob"></div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const KEY = "briar.scarlet.blocks.v1";
const BED = "briar.cup.bed.v1";
const ROOM = "briar.hearth.rooms.v1";
const MKT = "briar.market.day.v1";
const WEEK = 7 * 24 * 60 * 60 * 1000;
const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function marketBook() {
  try {
    const b = JSON.parse(localStorage.getItem(MKT) || "null");
    if (!b || b.day !== today() || !b.goods) return { day: today(), goods: {} };
    return b;
  } catch (e) { return { day: today(), goods: {} }; }
}
function listed(name) {
  const g = marketBook().goods[name];
  return g ? String(g).slice(0, 32) : "";
}
function stallLine(name) {
  const g = listed(name);
  return g
    ? ("Listed today: " + g + ". Not a parcel. Clears at midnight.")
    : "Empty board. List one good for the day. Not a parcel.";
}
function bedHeld() {
  try {
    const b = JSON.parse(localStorage.getItem(BED) || "null");
    if (!b || b.place !== "The Cup" || !b.until || b.until < Date.now()) return null;
    return b;
  } catch (e) { return null; }
}
function bedDays(b) {
  return Math.max(1, Math.ceil((b.until - Date.now()) / 86400000));
}
function roomBook() {
  try {
    const b = JSON.parse(localStorage.getItem(ROOM) || "{}");
    const out = {};
    ["Settle", "Loft"].forEach(n => { if (b[n] && b[n] > Date.now()) out[n] = b[n]; });
    return out;
  } catch (e) { return {}; }
}
function roomDays(until) {
  return Math.max(1, Math.ceil((until - Date.now()) / 86400000));
}
function paintRooms() {
  const book = roomBook();
  settle.textContent = book.Settle ? ("Settle · " + roomDays(book.Settle) + "d") : "Settle";
  loft.textContent = book.Loft ? ("Loft · " + roomDays(book.Loft) + "d") : "Loft";
}
const gold = new THREE.MeshStandardMaterial({ color: 0xe2c27a, roughness: 0.45 });

const cob = document.createElement("canvas");
cob.width = cob.height = 256;
const cg = cob.getContext("2d");
cg.fillStyle = "#141210";
cg.fillRect(0, 0, 256, 256);
for (let i = 0; i < 90; i++) {
  const x = (i * 47) % 256;
  const y = (i * 29) % 256;
  const w = 22 + (i % 5) * 4;
  const h = 16 + (i % 4) * 3;
  const wet = 28 + (i % 6) * 4;
  cg.fillStyle = `rgb(${wet + 8},${wet + 6},${wet + 4})`;
  cg.beginPath();
  cg.ellipse(x, y, w / 2, h / 2, (i % 5) * 0.2, 0, 7);
  cg.fill();
  cg.strokeStyle = "#0c0b0a";
  cg.lineWidth = 2;
  cg.stroke();
  cg.strokeStyle = "rgba(90,110,130,.28)";
  cg.lineWidth = 1;
  cg.beginPath();
  cg.moveTo(x - w * 0.28, y - h * 0.12);
  cg.lineTo(x + w * 0.22, y - h * 0.22);
  cg.stroke();
}
cg.fillStyle = "rgba(70,90,110,.12)";
for (let s = 0; s < 5; s++) {
  cg.fillRect(8 + s * 48, 20 + s * 30, 18, 180);
}
const cobble = new THREE.CanvasTexture(cob);
cobble.wrapS = cobble.wrapT = THREE.RepeatWrapping;
cobble.repeat.set(6, 18);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070c);
scene.fog = new THREE.Fog(0x05070c, 5, 20);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 60);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.AmbientLight(0x1c2436, 0.16));
scene.add(new THREE.HemisphereLight(0x1a2438, 0x0a0908, 0.1));

const street = new THREE.Mesh(
  new THREE.PlaneGeometry(7.2, 36),
  new THREE.MeshStandardMaterial({ map: cobble, roughness: 0.38, metalness: 0.14 })
);
street.rotation.x = -Math.PI / 2;
scene.add(street);
const verge = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 36),
  new THREE.MeshStandardMaterial({ color: 0x10140f, roughness: 0.9 })
);
verge.rotation.x = -Math.PI / 2;
verge.position.y = -0.02;
scene.add(verge);

const solids = [];
const doors = [];
function addSolid(x, z, w, d) {
  solids.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
}
function putBlock(group) {
  if (group.getObjectByName("walker-block")) return;
  const cube = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), gold);
  cube.name = "walker-block";
  cube.position.set(0.95, 3.2, 1.15);
  group.add(cube);
}
function house(x, z, face, name, kind, line) {
  const g = new THREE.Group();
  const plaster = new THREE.MeshStandardMaterial({ color: face, roughness: 0.85 });
  const timber = new THREE.MeshStandardMaterial({ color: 0x2a2118, roughness: 0.7 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.8, 3.2), plaster);
  body.position.y = 1.4;
  const beam = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.16, 3.3), timber);
  beam.position.y = 2.7;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.55, 1.15, 4), new THREE.MeshStandardMaterial({ color: 0x1b140f }));
  roof.position.y = 3.5;
  roof.rotation.y = Math.PI / 4;
  const pane = new THREE.MeshBasicMaterial({ color: 0xffb15a });
  const win = new THREE.Mesh(new THREE.PlaneGeometry(0.52, 0.62), pane);
  win.position.set(0.78, 1.72, 1.62);
  const win2 = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.5), pane);
  win2.position.set(-0.22, 1.78, 1.62);
  const hearth = new THREE.PointLight(0xff9a42, 1.1, 5.2, 2);
  hearth.position.set(0.28, 1.7, 2.05);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.62, 1.25, 0.12), timber);
  door.position.set(-0.45, 0.64, 1.66);
  g.add(body, beam, roof, win, win2, hearth, door);
  g.position.set(x, 0, z);
  if (x > 0) g.rotation.y = Math.PI;
  scene.add(g);
  addSolid(x, z, 3.4, 3.2);
  const lamp = new THREE.PointLight(0xffb15a, 1.6, 8);
  const doorZ = x > 0 ? z - 1.85 : z + 1.85;
  lamp.position.set(x, 2.3, doorZ);
  scene.add(lamp);
  if (saved[name]) putBlock(g);
  doors.push({ x, z: doorZ, name, kind, line, group: g });
}
house(-3.4, -8, 0xc4b49a, "Hearth", "house", "Two rooms: Settle and Loft. A week rent. The box stays with the key.");
house(3.4, -4, 0x8a5a48, "Loaf", "shop", "Floor and a back room. Open. One block.");
house(-3.4, 0, 0x6e5344, "The Cup", "inn", "Four beds. A week rent. The box stays with the key.");
house(3.4, 4, 0xb7a48c, "Quill", "shop", "A counter. Open. One block.");
house(-3.4, 8, 0x4e4036, "Forge", "workshop", "Work floor. Open. One block.");
house(3.4, 12, 0x7a4038, "Last Door", "inn", "Five beds. Open. The end of Scarlet.");

function hangSign(x, z, faceStreet, label, line) {
  const c = document.createElement("canvas");
  c.width = 512;
  c.height = 192;
  const g2 = c.getContext("2d");
  g2.fillStyle = "#cbb892";
  g2.fillRect(0, 0, 512, 192);
  g2.strokeStyle = "#3a2a18";
  g2.lineWidth = 16;
  g2.strokeRect(10, 10, 492, 172);
  g2.fillStyle = "#1c140c";
  g2.font = label.length > 10 ? "52px Georgia" : "64px Georgia";
  g2.textAlign = "center";
  g2.textBaseline = "middle";
  g2.fillText(label, 256, 100);
  const tex = new THREE.CanvasTexture(c);
  const board = new THREE.Mesh(
    new THREE.BoxGeometry(1.45, 0.5, 0.06),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.78 })
  );
  const iron = new THREE.MeshStandardMaterial({ color: 0x2c2a28, metalness: 0.35, roughness: 0.55 });
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.85), iron);
  arm.position.set(0, 0.38, faceStreet > 0 ? -0.4 : 0.4);
  const hook = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.55, 0.07), iron);
  hook.position.set(0, 0.62, faceStreet > 0 ? -0.78 : 0.78);
  const grp = new THREE.Group();
  grp.add(board, arm, hook);
  grp.position.set(x, 2.45, z);
  grp.rotation.y = faceStreet > 0 ? Math.PI / 2 : -Math.PI / 2;
  scene.add(grp);
  doors.push({ x, z, name: label, kind: "sign", line, group: grp });
}
hangSign(-2.05, -1.1, 1, "Inn", "Painted board over The Cup. A bed, not the box.");
hangSign(2.05, -5.1, -1, "Sweep", "A broom on the board. Not a house.");
hangSign(-2.05, 7.2, 1, "Crooked Crow", "Old tavern board. The bird is painted, not a person.");
hangSign(2.05, 11.2, -1, "Last Lamp", "Last lit board on Scarlet. Not a key.");
hangSign(2.05, 3.1, -1, "Clerk", "A desk board by Quill. The counter stays the shop.");

function streetLamp(x, z, n) {
  const iron = new THREE.MeshStandardMaterial({ color: 0x2a2622, metalness: 0.4, roughness: 0.5 });
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.08, 2.2, 8), iron);
  post.position.y = 1.1;
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.38), iron);
  arm.position.set(0, 2.12, x > 0 ? -0.16 : 0.16);
  const cage = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.3, 0.26), iron);
  cage.position.set(0, 2.1, x > 0 ? -0.34 : 0.34);
  const glass = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xffc98a })
  );
  glass.position.copy(cage.position);
  const glow = new THREE.PointLight(0xffb15a, 1.25, 7.2);
  glow.position.copy(glass.position);
  const grp = new THREE.Group();
  grp.add(post, arm, cage, glass, glow);
  grp.position.set(x, 0, z);
  scene.add(grp);
  doors.push({
    x, z,
    name: "Lamp " + n,
    kind: "lamp",
    line: "Warm light on Scarlet. A lamp is not a key.",
    group: grp
  });
}
[-12, -6, 0, 6, 12].forEach((z, i) => {
  streetLamp(-2.4, z, i * 2 + 1);
  streetLamp(2.4, z, i * 2 + 2);
});

function stall(x, z, name, cloth) {
  const wood = new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 0.8 });
  const table = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.72, 0.7), wood);
  table.position.y = 0.36;
  const awning = new THREE.Mesh(
    new THREE.BoxGeometry(1.28, 0.08, 0.86),
    new THREE.MeshStandardMaterial({ color: cloth, roughness: 0.7 })
  );
  awning.position.set(0, 1.55, 0.05);
  const poleL = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.2, 6), wood);
  poleL.position.set(-0.52, 0.95, -0.28);
  const poleR = poleL.clone();
  poleR.position.x = 0.52;
  const c = document.createElement("canvas");
  c.width = 256;
  c.height = 96;
  const g2 = c.getContext("2d");
  g2.fillStyle = "#efe2c4";
  g2.fillRect(0, 0, 256, 96);
  g2.fillStyle = "#1c140c";
  g2.font = "36px Georgia";
  g2.textAlign = "center";
  g2.textBaseline = "middle";
  g2.fillText(name, 128, 48);
  const board = new THREE.Mesh(
    new THREE.BoxGeometry(0.72, 0.28, 0.04),
    new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(c), roughness: 0.8 })
  );
  board.position.set(0, 1.15, 0.36);
  const grp = new THREE.Group();
  grp.add(table, awning, poleL, poleR, board);
  grp.position.set(x, 0, z);
  scene.add(grp);
  addSolid(x, z, 1.15, 0.7);
  doors.push({
    x, z: z + 0.55,
    name,
    kind: "stall",
    line: stallLine(name),
    group: grp
  });
}
[
  ["Apple", 0xc45a3a],
  ["Cloth", 0x3a5a78],
  ["Salt", 0xd8d0c4],
  ["Wick", 0xc4a24a]
].forEach((s, i) => stall(-1.65 + i * 1.1, -13.4, s[0], s[1]));

const well = new THREE.Group();
const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.82, 0.7, 8), new THREE.MeshStandardMaterial({ color: 0x6a7268 }));
rim.position.y = 0.35;
well.add(rim);
well.position.set(0, 0, 14.4);
scene.add(well);
doors.push({ x: 0, z: 13.3, name: "Well", kind: "town", line: "Town water. Not a house. The block is refused.", group: well });

addSolid(0, -16.2, 8, 0.6);
addSolid(0, 16.2, 8, 0.6);
const endMat = new THREE.MeshStandardMaterial({ color: 0x2c261e });
[[-16.2], [16.2]].forEach(([z]) => {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(8, 1.6, 0.4), endMat);
  wall.position.set(0, 0.8, z);
  scene.add(wall);
});

const player = { x: 0, z: -11.2, yaw: Math.PI };
const R = 0.38;
let joy = { x: 0, y: 0 }, look = false, lx = 0, current = null;
const stick = document.getElementById("stick"), knob = document.getElementById("knob");
stick.addEventListener("pointerdown", e => stick.setPointerCapture(e.pointerId));
stick.addEventListener("pointermove", e => {
  if (!stick.hasPointerCapture(e.pointerId)) return;
  const r = stick.getBoundingClientRect();
  joy.x = Math.max(-1, Math.min(1, (e.clientX - r.left - 52) / 36));
  joy.y = Math.max(-1, Math.min(1, (e.clientY - r.top - 52) / 36));
  knob.style.left = 31 + joy.x * 26 + "px";
  knob.style.top = 31 + joy.y * 26 + "px";
});
stick.addEventListener("pointerup", () => { joy = { x: 0, y: 0 }; knob.style.left = "31px"; knob.style.top = "31px"; });
renderer.domElement.addEventListener("pointerdown", e => { look = true; lx = e.clientX; });
addEventListener("pointerup", () => look = false);
addEventListener("pointermove", e => { if (look) { player.yaw -= (e.clientX - lx) * 0.006; lx = e.clientX; } });

function blocked(x, z) {
  return solids.some(s => x > s.minX - R && x < s.maxX + R && z > s.minZ - R && z < s.maxZ + R);
}
function moveAxis(nx, nz) {
  if (!blocked(nx, player.z) && Math.abs(nx) < 3.15) player.x = nx;
  if (!blocked(player.x, nz) && nz > -15.4 && nz < 15.4) player.z = nz;
}
function refused(kind) { return kind === "town" || kind === "sign" || kind === "lamp" || kind === "stall"; }
place.onclick = () => {
  if (!current) return;
  card.dataset.lock = "1";
  if (refused(current.kind)) {
    cdoes.textContent = current.kind === "stall"
      ? "A day stall. Not a parcel. The block is refused."
      : current.kind === "sign"
        ? "A hanging board. The block is refused."
        : current.kind === "lamp"
          ? "A lamp. Not a key. The block is refused."
          : "Town parcel. The block is refused.";
    return;
  }
  if (saved[current.name]) {
    cdoes.textContent = "One block already sits on " + current.name + ".";
    return;
  }
  putBlock(current.group);
  saved[current.name] = 1;
  localStorage.setItem(KEY, JSON.stringify(saved));
  cdoes.textContent = "One block placed on " + current.name + ". Saved on this browser.";
};
function rentRoom(name) {
  if (!current || current.name !== "Hearth") return;
  card.dataset.lock = "1";
  const book = roomBook();
  if (book[name]) {
    cdoes.textContent = name + " already held for " + roomDays(book[name]) + " day" + (roomDays(book[name]) === 1 ? "" : "s") + ". The box is not yours.";
    return;
  }
  book[name] = Date.now() + WEEK;
  localStorage.setItem(ROOM, JSON.stringify(book));
  cdoes.textContent = name + " rented for a week. A room, not the box. Saved on this browser.";
  paintRooms();
}
settle.onclick = () => rentRoom("Settle");
loft.onclick = () => rentRoom("Loft");
bed.onclick = () => {
  if (!current || current.name !== "The Cup") return;
  card.dataset.lock = "1";
  const held = bedHeld();
  if (held) {
    cdoes.textContent = "Bed already held for " + bedDays(held) + " day" + (bedDays(held) === 1 ? "" : "s") + ". The box is not yours.";
    return;
  }
  localStorage.setItem(BED, JSON.stringify({ place: "The Cup", until: Date.now() + WEEK }));
  cdoes.textContent = "Bed rented for a week. Saved on this browser. The box stays closed.";
  bed.textContent = "Bed held · 7d";
};
list.onclick = () => {
  if (!current || current.kind !== "stall") return;
  card.dataset.lock = "1";
  const good = (good.value || "").trim().slice(0, 32);
  if (!good) {
    cdoes.textContent = "Write one good. It lasts the day. Not a parcel.";
    return;
  }
  const b = marketBook();
  b.day = today();
  b.goods[current.name] = good;
  localStorage.setItem(MKT, JSON.stringify(b));
  current.line = stallLine(current.name);
  cdoes.textContent = current.name + " lists " + good + " today. Saved on this browser.";
  good.value = "";
};
hide.addEventListener("click", () => { card.dataset.lock = "1"; card.style.display = "none"; });

function loop() {
  const nx = player.x + Math.sin(player.yaw) * -joy.y * 0.08 + Math.cos(player.yaw) * joy.x * 0.08;
  const nz = player.z + Math.cos(player.yaw) * -joy.y * 0.08 - Math.sin(player.yaw) * joy.x * 0.08;
  moveAxis(nx, nz);
  const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw);
  const near = doors.find(d => {
    const dx = d.x - player.x, dz = d.z - player.z;
    const dist = Math.hypot(dx, dz);
    return dist < 1.55 && (dx * fx + dz * fz) > 0.35;
  });
  if (near && card.dataset.lock !== "1") {
    current = near;
    cname.textContent = near.name;
    if (near.kind === "stall") near.line = stallLine(near.name);
    cdoes.textContent = near.kind + ". " + near.line;
    place.style.display = near.kind === "stall" ? "none" : "inline-block";
    place.textContent = near.kind === "lamp" ? "Lamp only" : refused(near.kind) ? "Board only" : (saved[near.name] ? "Block set" : "Place one block");
    bed.style.display = near.name === "The Cup" ? "inline-block" : "none";
    const hearth = near.name === "Hearth";
    settle.style.display = hearth ? "inline-block" : "none";
    loft.style.display = hearth ? "inline-block" : "none";
    if (hearth) {
      paintRooms();
      const book = roomBook();
      const held = ["Settle", "Loft"].filter(n => book[n]).map(n => n + " · " + roomDays(book[n]) + "d");
      if (held.length) cdoes.textContent = "house. " + held.join(". ") + ". A room, not the box.";
    }
    list.style.display = near.kind === "stall" ? "inline-block" : "none";
    good.style.display = near.kind === "stall" ? "inline-block" : "none";
    if (near.name === "The Cup") {
      const held = bedHeld();
      bed.textContent = held ? ("Bed held · " + bedDays(held) + "d") : "Rent a bed";
    }
    card.style.display = "block";
    where.textContent = near.name;
  } else if (!near) {
    current = null;
    card.dataset.lock = "0";
    card.style.display = "none";
    where.textContent = "on the cobbles";
  }
  const now = performance.now();
  doors.forEach(d => {
    if (d.kind !== "lamp") return;
    const glow = d.group.children[4];
    if (glow) glow.intensity = 1.05 + Math.sin(now * 0.004 + d.z) * 0.22;
  });
  camera.position.set(player.x, 1.6, player.z);
  camera.lookAt(player.x + fx, 1.45, player.z + fz);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
