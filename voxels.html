<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Norham voxels</title>
<style>
  html, body { margin: 0; height: 100%; background: #8ec5e8; overflow: hidden; touch-action: none; color: #1a140c; font: 16px Georgia, serif; }
  canvas { display: block; }
  #card { position: fixed; left: 10px; right: 10px; bottom: 120px; display: none; background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 8px 24px #0004; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 8px 10px; margin: 8px 6px 0 0; background: #1a140c; color: #fff; }
  #stick { position: fixed; left: 14px; bottom: 14px; width: 100px; height: 100px; border-radius: 50%; background: #fff8; }
  #knob { width: 40px; height: 40px; border-radius: 50%; background: #1a140c; position: absolute; left: 30px; top: 30px; }
</style>
</head>
<body>
<div id="card"><b id="cname"></b><div id="cmeta"></div><div id="cdoes"></div>
  <button id="enter">Enter</button><button id="build">Place block</button><button id="hide">Close</button></div>
<div id="stick"><div id="knob"></div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ec5e8);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 80);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa66, 1));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color:0x67a85a }));
ground.rotation.x = -Math.PI/2;
scene.add(ground);
const parcels = [];
const colors = [0xf2efe6, 0xd7c4a3, 0xb7c7d6, 0xe7d7c1];
for (let gx = -2; gx <= 2; gx++) for (let gz = -1; gz <= 1; gz++) {
  const plot = new THREE.Group();
  const pad = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.2, 3.6), new THREE.MeshLambertMaterial({ color:0xded5c4 }));
  pad.position.y = 0.1;
  plot.add(pad);
  const mat = new THREE.MeshLambertMaterial({ color: colors[(gx+gz+4)%colors.length] });
  for (let y=0;y<2;y++) for (let x=0;x<3;x++) for (let z=0;z<3;z++) {
    if (y===0 && x===1 && z===2) continue;
    const cube = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9), mat);
    cube.position.set((x-1)*0.95, 0.7+y*0.95, (z-1)*0.95);
    plot.add(cube);
  }
  plot.position.set(gx*4.2, 0, gz*4.2);
  plot.userData = { name: gx===0&&gz===0?"The Gate":"Parcel "+(gx+3)+"-"+(gz+2), owner: gx===0?"Norham":"open", kind: gz===1?"town":"house" };
  scene.add(plot);
  parcels.push(plot);
}
const player = { x:0, z:-6, yaw:0 };
let joy={x:0,y:0}, look=false, lx=0, selected=null;
const stick=document.getElementById("stick"), knob=document.getElementById("knob");
stick.addEventListener("pointerdown", e => stick.setPointerCapture(e.pointerId));
stick.addEventListener("pointermove", e => {
  if (!stick.hasPointerCapture(e.pointerId)) return;
  const r=stick.getBoundingClientRect();
  joy.x=Math.max(-1,Math.min(1,(e.clientX-r.left-50)/34));
  joy.y=Math.max(-1,Math.min(1,(e.clientY-r.top-50)/34));
  knob.style.left=30+joy.x*24+"px"; knob.style.top=30+joy.y*24+"px";
});
stick.addEventListener("pointerup", () => { joy={x:0,y:0}; knob.style.left="30px"; knob.style.top="30px"; });
renderer.domElement.addEventListener("pointerdown", e => {
  look=true; lx=e.clientX;
  const ray=new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const hit=ray.intersectObjects(parcels, true)[0];
  if (!hit) return;
  selected=hit.object.parent;
  cname.textContent=selected.userData.name;
  cmeta.textContent=selected.userData.kind+" · "+selected.userData.owner;
  cdoes.textContent="Walk up. Read the parcel. Build only on an open house.";
  card.style.display="block";
});
addEventListener("pointerup", () => look=false);
addEventListener("pointermove", e => { if (look) { player.yaw -= (e.clientX-lx)*0.005; lx=e.clientX; } });
hide.onclick=()=>card.style.display="none";
enter.onclick=()=>{ if(selected) cdoes.textContent="You are on the parcel."; };
build.onclick=()=>{
  if (!selected || selected.userData.kind!=="house") { cdoes.textContent="Town parcels cannot be built on."; return; }
  const cube=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9), new THREE.MeshLambertMaterial({ color:0xe2c27a }));
  cube.position.set(0, 2.6, 0);
  selected.add(cube);
  cdoes.textContent="Block placed.";
};
function loop(){
  player.x += Math.sin(player.yaw)*-joy.y*0.08 + Math.cos(player.yaw)*joy.x*0.08;
  player.z += Math.cos(player.yaw)*-joy.y*0.08 - Math.sin(player.yaw)*joy.x*0.08;
  camera.position.set(player.x, 1.7, player.z);
  camera.lookAt(player.x+Math.sin(player.yaw), 1.5, player.z+Math.cos(player.yaw));
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
