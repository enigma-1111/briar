<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Briar — Norham</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #100e0c; color: #f4ead8; font: 17px/1.4 Georgia, serif; }
  header { padding: 32px 18px 12px; background: radial-gradient(circle at 50% 120%, #3a2a16, #100e0c 70%); }
  h1 { margin: 0; letter-spacing: .18em; font-weight: normal; font-size: 36px; }
  h2 { font-weight: normal; letter-spacing: .08em; font-size: 15px; margin: 22px 16px 8px; }
  a { color: #e2c27a; }
  .muted { color: #cbb892; }
  .map { margin: 8px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .block { border: 1px solid #4a3d28; border-radius: 12px; padding: 12px; background: #1a1612; }
  .live { border-color: #e2c27a; }
  .town { background: #1c2218; }
  .row { display: flex; gap: 10px; overflow-x: auto; padding: 4px 16px 16px; scroll-snap-type: x mandatory; }
  .card { scroll-snap-align: start; min-width: 168px; background: #1a1612; border: 1px solid #4a3d28; border-radius: 14px; padding: 14px; }
  button, .block { font: inherit; color: inherit; }
  button { border: 0; border-radius: 999px; padding: 8px 12px; margin-top: 8px; background: #e2c27a; color: #1a140c; }
  .sheet { position: fixed; inset: auto 0 0 0; background: #14120e; border-top: 1px solid #4a3d28; padding: 18px 18px 28px; transform: translateY(110%); transition: .2s; }
  .sheet.open { transform: none; }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid #2c261c; }
  .k { color: #9c9078; }
  .ghost { background: transparent; color: #e2c27a; border: 1px solid #e2c27a; }
</style>
</head>
<body>
<header>
  <h1>BRIAR</h1>
  <p>Norham. First city. Scarlet is the only street cut.</p>
  <p class="muted">Nothing is sold yet. <a href="rules.html">Rules</a> · <a href="greenwood.html">Greenwood</a></p>
</header>
<div class="map" id="map"></div>
<h2>SCARLET</h2>
<div class="row" id="scarlet"></div>
<div class="sheet" id="sheet">
  <b id="name"></b>
  <div class="muted" id="kind"></div>
  <div class="line"><span class="k">Inside</span><span id="rooms"></span></div>
  <div class="line"><span class="k">Price</span><span id="price"></span></div>
  <button id="act">Open</button>
  <button class="ghost" id="close">Close</button>
  <p class="muted" id="note"></p>
</div>
<script>
const places = [
  ["Greenwood","wood","oaks and one chapel","not for sale","town"],
  ["Chapel","chapel","one room","not for sale","town"],
  ["Gate","center","A note, not a swap. The city keeps a tenth. No coin moves.","city keeps a tenth","town"],
  ["Market","stalls","a day stall, not a parcel","not a key","town"],
  ["Inn","public room","one hearth","not a key","town"],
  ["Hearth","house","2 rooms","50 Briar","key"],
  ["Loaf","shop","floor, back room","70 Briar","key"],
  ["The Cup","inn","4 beds","160 Briar","key"],
  ["Quill","shop","counter","80 Briar","key"],
  ["Forge","workshop","work floor","140 Briar","key"],
  ["Last Door","inn","5 beds","200 Briar","key"],
  ["Marian","street","18 houses","not cut","later"],
  ["John","street","18 houses","not cut","later"],
  ["Much","mill street","16 houses","not cut","later"]
];
const map = document.getElementById("map");
const row = document.getElementById("scarlet");
let current = null;
places.forEach(p => {
  if (p[4] === "key") {
    const d = document.createElement("article");
    d.className = "card";
    d.innerHTML = "<b>"+p[0]+"</b><div class='muted'>"+p[1]+"</div><button>Open</button>";
    d.querySelector("button").onclick = () => openPlace(p);
    row.appendChild(d);
  } else {
    const b = document.createElement("button");
    b.className = "block " + (p[4] === "town" ? "town" : "");
    b.innerHTML = "<b>"+p[0]+"</b><div class='muted'>"+p[3]+"</div>";
    b.onclick = () => openPlace(p);
    map.appendChild(b);
  }
});
function openPlace(p) {
  current = p;
  name.textContent = p[0];
  kind.textContent = p[1];
  rooms.textContent = p[2];
  price.textContent = p[3];
  act.disabled = false;
  if (p[0] === "Greenwood") {
    note.textContent = "Town wood. Oaks and one chapel. You can walk it. You cannot buy it.";
    act.textContent = "Walk the Greenwood";
  } else if (p[0] === "Market") {
    note.textContent = "Apple, Cloth, Salt, Wick. List one good for the day. Not a parcel.";
    act.textContent = "Walk the stalls";
  } else if (p[0] === "Gate") {
    note.textContent = "Note only. No swap.";
    act.textContent = "Open";
  } else if (p[4] === "later") {
    note.textContent = "Drawn. Not cut. You may look down the street. No door opens.";
    act.textContent = "Look down the street";
  } else if (p[4] === "key") {
    note.textContent = "A Briar key later. Nothing is sold yet.";
    act.textContent = "Open";
  } else {
    note.textContent = "Not a key.";
    act.textContent = "Open";
  }
  sheet.classList.add("open");
}
act.onclick = () => {
  if (current && current[0] === "Greenwood") { location.href = "greenwood.html"; return; }
  if (current && current[0] === "Market") { location.href = "street.html"; return; }
  if (current && current[4] === "later") { location.href = "locked.html?street=" + encodeURIComponent(current[0]); return; }
  note.textContent = "Not open for money yet.";
  act.disabled = true;
};
close.onclick = () => sheet.classList.remove("open");
</script>
</body>
</html>
