<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Norham</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c; touch-action: none; color: #f4ead8; font: 16px Georgia, serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 14px; top: 12px; text-shadow: 0 2px 6px #000; pointer-events: none; }
  #card { position: fixed; left: 12px; right: 12px; bottom: 128px; display: none; background: #14120ee8; border: 1px solid #e2c27a; border-radius: 14px; padding: 12px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 8px 12px; margin: 8px 8px 0 0; background: #e2c27a; color: #1a140c; }
  .ghost { background: transparent; color: #e2c27a; border: 1px solid #e2c27a; }
  #stick { position: fixed; left: 16px; bottom: 16px; width: 108px; height: 108px; border-radius: 50%; border: 1px solid rgba(226,194,122,.6); }
  #knob { width: 44px; height: 44px; border-radius: 50%; background: #e2c27a; position: absolute; left: 32px; top: 32px; }
</style>
</head>
<body>
<div id="hud">NORHAM<br><span id="where">Scarlet</span></div>
<div id="card"><b id="cname"></b><div id="cdoes"></div><button id="go">Go in</button><button class="ghost" id="hide">Close</button></div>
<div id="stick"><div id="knob"></div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141822);
scene.fog = new THREE.Fog(0x141822, 12, 40);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 80);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x6d7890, 0x1a140e, 0.7));
function lamp(x, z) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 2.4), new THREE.MeshStandardMaterial({ color: 0x221c16 }));
  pole.position.set(x, 1.2, z);
  const glow = new THREE.PointLight(0xffb15a, 3, 8);
  glow.position.set(x, 2.2, z);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshBasicMaterial({ color: 0xffd7a1 }));
  bulb.position.copy(glow.position);
  scene.add(pole, glow, bulb);
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x2a241c, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(5, 28), new THREE.MeshStandardMaterial({ color: 0x3c342c }));
road.rotation.x = -Math.PI / 2;
road.position.y = 0.02;
scene.add(road);
for (let i = -8; i <= 8; i += 4) lamp(-2.8, i);
const places = [
  ["The Inn", -7, -6, 0x6a5644, "Public room. Not a key."],
  ["Market", 0, -10, 0x5a5044, "Stalls. Not a parcel."],
  ["Hearth", 7, -6, 0x705c48, "Two rooms."],
  ["Loaf", 7, -1, 0x665444, "Shop floor."],
  ["The Cup", 7, 4, 0x5c5046, "Four beds."],
  ["Chapel", -8, 3, 0x3e443c, "Not for sale."],
  ["Gate", 0, 10, 0x4a4036, "City keeps a tenth."]
];
const meshes = places.map(p => {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.8, 3.2), new THREE.MeshStandardMaterial({ color: p[3] }));
  body.position.y = 1.4;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.6, 1.2, 4), new THREE.MeshStandardMaterial({ color: 0x1a140f }));
  roof.position.y = 3.3;
  roof.rotation.y = Math.PI / 4;
  for (const w of [[-0.8, 1.6, 1.62], [0.8, 1.6, 1.62]]) {
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.7), new THREE.MeshBasicMaterial({ color: 0xffc98a }));
    win.position.set(w[0], w[1], w[2]);
    g.add(win);
  }
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.3, 0.08), new THREE.MeshStandardMaterial({ color: 0x2a2118 }));
  door.position.set(0, 0.65, 1.62);
  g.add(body, roof, door);
  g.position.set(p[1], 0, p[2]);
  g.userData = { name: p[0], does: p[4] };
  scene.add(g);
  return g;
});
const player = { x: 0, z: 0, yaw: 0 };
let joy = { x: 0, y: 0 }, look = false, lx = 0, selected = null, inside = false;
const stick = document.getElementById("stick"), knob = document.getElementById("knob");
stick.addEventListener("pointerdown", e => stick.setPointerCapture(e.pointerId));
stick.addEventListener("pointermove", e => {
  if (!stick.hasPointerCapture(e.pointerId)) return;
  const r = stick.getBoundingClientRect();
  joy.x = Math.max(-1, Math.min(1, (e.clientX - r.left - 54) / 38));
  joy.y = Math.max(-1, Math.min(1, (e.clientY - r.top - 54) / 38));
  knob.style.left = 32 + joy.x * 26 + "px";
  knob.style.top = 32 + joy.y * 26 + "px";
});
stick.addEventListener("pointerup", () => { joy = { x: 0, y: 0 }; knob.style.left = "32px"; knob.style.top = "32px"; });
renderer.domElement.addEventListener("pointerdown", e => {
  look = true; lx = e.clientX;
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const hit = ray.intersectObjects(meshes, true)[0];
  if (!hit) return;
  selected = hit.object.parent;
  cname.textContent = selected.userData.name;
  cdoes.textContent = selected.userData.does;
  card.style.display = "block";
  go.textContent = "Go in";
  inside = false;
});
addEventListener("pointerup", () => look = false);
addEventListener("pointermove", e => { if (look) { player.yaw -= (e.clientX - lx) * 0.006; lx = e.clientX; } });
hide.onclick = () => { card.style.display = "none"; selected = null; inside = false; where.textContent = "Scarlet"; };
go.onclick = () => { inside = !inside; where.textContent = inside ? selected.userData.name : "Scarlet"; go.textContent = inside ? "Go out" : "Go in"; };
function loop() {
  if (!inside) {
    player.x += Math.sin(player.yaw) * -joy.y * 0.09 + Math.cos(player.yaw) * joy.x * 0.09;
    player.z += Math.cos(player.yaw) * -joy.y * 0.09 - Math.sin(player.yaw) * joy.x * 0.09;
    player.x = Math.max(-12, Math.min(12, player.x));
    player.z = Math.max(-12, Math.min(12, player.z));
  }
  const px = inside && selected ? selected.position.x : player.x;
  const pz = inside && selected ? selected.position.z : player.z;
  camera.position.set(px, 1.6, pz);
  camera.lookAt(px + Math.sin(player.yaw), 1.45, pz + Math.cos(player.yaw));
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
