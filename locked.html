<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Norham</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c1016; overflow: hidden; touch-action: none; color: #f4ead8; font: 16px/1.35 Georgia, serif; }
  canvas { display: block; }
  #bar { position: fixed; left: 12px; right: 12px; top: 12px; border: 1px solid #6a6258; border-radius: 12px; padding: 10px 12px; background: #121018ee; }
  .muted { color: #cbb892; }
  a { color: #e2c27a; }
</style>
</head>
<body>
<div id="bar"><b id="title">Locked</b><div class="muted" id="note">Drawn. Not cut. No door opens.</div><a href="map.html">Map</a> · <a href="street.html">Scarlet</a></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const book = {
  Marian: { n: 18, line: "Marian. Eighteen shutters. East of Scarlet. Not cut." },
  John: { n: 18, line: "John. Eighteen shutters. Not cut." },
  Much: { n: 16, line: "Much. Sixteen shutters and a mill. Not cut." }
};
const q = new URLSearchParams(location.search).get("street") || "Marian";
const street = book[q] ? q : "Marian";
const spec = book[street];
title.textContent = street;
note.textContent = spec.line;
document.title = street + " — locked";
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141c);
scene.fog = new THREE.Fog(0x10141c, 6, 28);
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 80);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.AmbientLight(0x6a7088, 0.45));
const moon = new THREE.DirectionalLight(0x9aa4c0, 0.25);
moon.position.set(-6, 12, -4);
scene.add(moon);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 48), new THREE.MeshStandardMaterial({ color: 0x141820 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const road = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.05, spec.n * 1.6 + 4), new THREE.MeshStandardMaterial({ color: 0x2a241c }));
road.position.set(0, 0.03, spec.n * 0.8);
scene.add(road);
const wall = new THREE.MeshStandardMaterial({ color: 0x2c3140 });
const shutter = new THREE.MeshStandardMaterial({ color: 0x1a1e28 });
const wood = new THREE.MeshStandardMaterial({ color: 0x3a342c });
for (let i = 0; i < spec.n; i++) {
  const side = i % 2 ? 2.2 : -2.2;
  const z = 2 + i * 1.6;
  const house = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.2, 1.3), wall);
  house.position.set(side, 1.1, z);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.9, 0.06), shutter);
  door.position.set(side > 0 ? side - 0.92 : side + 0.92, 0.55, z);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.08), wood);
  bar.position.copy(door.position);
  bar.position.y = 0.7;
  scene.add(house, door, bar);
}
if (street === "Much") {
  const mill = new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.2, 2.2), wall);
  mill.position.set(0, 1.6, spec.n * 1.6 + 2);
  const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.16, 12), shutter);
  wheel.rotation.z = Math.PI / 2;
  wheel.position.set(1.5, 1.2, spec.n * 1.6 + 2);
  scene.add(mill, wheel);
}
let z = 1, joy = 0;
addEventListener("pointerdown", e => { joy = e.clientX > innerWidth / 2 ? 1 : -1; });
addEventListener("pointerup", () => joy = 0);
function loop() {
  z = Math.max(1, Math.min(spec.n * 1.6, z + joy * 0.08));
  camera.position.set(0, 1.55, z);
  camera.lookAt(0, 1.3, z + 4);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
