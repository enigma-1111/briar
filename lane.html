<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Norham</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c1016; overflow: hidden; touch-action: none; color: #f4ead8; font: 16px Georgia, serif; }
  canvas { display: block; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #14120ef2; border-top: 1px solid #e2c27a; padding: 16px 16px 28px; transform: translateY(110%); transition: .2s; }
  #sheet.open { transform: none; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 10px 14px; margin-top: 8px; background: #e2c27a; color: #1a140c; }
  .muted { color: #cbb892; }
</style>
</head>
<body>
<div id="sheet"><b id="name"></b><div class="muted" id="meta"></div><p id="line"></p><button id="close">Back</button></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const c = document.createElement("canvas");
c.width = c.height = 256;
const g = c.getContext("2d");
g.fillStyle = "#2a241c";
g.fillRect(0, 0, 256, 256);
for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
  const ox = (y % 2) * 16;
  g.fillStyle = `rgb(${48 + (x*y)%28},${40 + (x*3)%20},${32 + (y*5)%16})`;
  g.beginPath();
  g.ellipse(x * 32 + 16 + ox, y * 32 + 16, 13, 10, 0, 0, 7);
  g.fill();
  g.strokeStyle = "#1a140e";
  g.stroke();
}
const cobble = new THREE.CanvasTexture(c);
cobble.wrapS = cobble.wrapT = THREE.RepeatWrapping;
cobble.repeat.set(4, 8);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141820);
scene.fog = new THREE.Fog(0x141820, 8, 32);
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 80);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.AmbientLight(0x8090a8, 0.4));
scene.add(new THREE.PointLight(0xffb15a, 5, 16));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color:0x1c1814 }));
ground.rotation.x = -Math.PI/2;
scene.add(ground);
const lane = [];
for (let i = 0; i < 28; i++) lane.push(new THREE.Vector3(Math.sin(i/27*2.2)*6, 0.04, -12 + i/27*24));
const roadMat = new THREE.MeshStandardMaterial({ map: cobble, roughness: 1 });
for (let i = 0; i < lane.length - 1; i++) {
  const a = lane[i], b = lane[i+1];
  const stone = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.06, a.distanceTo(b)+0.15), roadMat);
  stone.position.copy(a).lerp(b, 0.5);
  stone.lookAt(b.x, 0.04, b.z);
  scene.add(stone);
}
const loader = new THREE.TextureLoader();
const pics = ["img/pub.jpg","img/market.jpg","img/street.jpg","img/wick.jpg"].map(u => loader.load(u));
const signs = ["The Inn","Sweep","Crooked Crow","Last Lamp","Clerk","Chapel"];
const boards = [];
signs.forEach((label, i) => {
  const p = lane[3 + i * 4];
  const side = i % 2 ? 2 : -2;
  const wall = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.6, 0.3), new THREE.MeshStandardMaterial({ map: pics[i % pics.length] }));
  wall.position.set(p.x + side, 1.3, p.z);
  wall.lookAt(p.x, 1.3, p.z);
  wall.userData = { name: label, kind: "lane", line: "A door on the cobbles." };
  scene.add(wall);
  boards.push(wall);
});
let i = 4, joy = 0;
addEventListener("pointerdown", e => {
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const hit = ray.intersectObjects(boards)[0];
  if (hit) { name.textContent = hit.object.userData.name; meta.textContent = "cobbled lane"; line.textContent = hit.object.userData.line; sheet.classList.add("open"); return; }
  joy = e.clientX > innerWidth/2 ? 1 : -1;
});
addEventListener("pointerup", () => joy = 0);
close.onclick = () => sheet.classList.remove("open");
function loop() {
  i = Math.max(1, Math.min(lane.length - 2, i + joy * 0.04));
  const p = lane[Math.floor(i)], n = lane[Math.min(lane.length - 1, Math.floor(i)+1)];
  camera.position.set(p.x, 1.55, p.z);
  camera.lookAt(n.x, 1.3, n.z);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
